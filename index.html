<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Dino Officina — monta il tuo veicolo e guidalo, per tablet.">
<meta name="theme-color" content="#183f37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Officina">
<title>Dino Officina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden; background: #0b2418;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; touch-action: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#c { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---- text entry overlay (only place we use DOM: we want the native keyboard) ---- */
#ovl {
  position: fixed; inset: 0; display: none; z-index: 10;
  align-items: center; justify-content: center;
  background: rgba(8, 26, 18, .72); backdrop-filter: blur(3px);
  padding: 16px;
}
#ovl.on { display: flex; }
#ovl .card {
  background: #fff6e0; border: 6px solid #7a4a26; border-radius: 26px;
  padding: 22px 24px; width: min(460px, 92vw);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
#ovl h2 { margin: 0 0 14px; font-size: 24px; color: #2b1d12; font-weight: 800; }
#ovl input {
  width: 100%; font-size: 26px; padding: 12px 14px; border-radius: 14px;
  border: 4px solid #cdb389; background: #fffdf6; color: #2b1d12;
  font-family: inherit; font-weight: 700; outline: none;
}
#ovl input:focus { border-color: #2f8f4e; }
#ovl .row { display: flex; gap: 12px; margin-top: 18px; }
#ovl button {
  flex: 1; font-size: 22px; font-weight: 800; padding: 14px 10px;
  border-radius: 16px; border: none; color: #fff; font-family: inherit;
  cursor: pointer; min-height: 60px;
}
#ovl .ok { background: #2f8f4e; }
#ovl .no { background: #a8998a; }

/* ---- portrait nudge ---- */
#rot {
  position: fixed; inset: 0; display: none; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #123d29; color: #fff6e0; text-align: center; padding: 30px;
}
#rot.on { display: flex; }
#rot .ico { font-size: 84px; animation: tilt 1.8s ease-in-out infinite; }
#rot p { font-size: 26px; font-weight: 800; margin: 0; line-height: 1.35; }
@keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

@media (prefers-reduced-motion: reduce) { #rot .ico { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ovl" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="ovl-t">Come ti chiami?</h2>
    <input id="ovl-i" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="14">
    <div class="row">
      <button class="no" id="ovl-n">Annulla</button>
      <button class="ok" id="ovl-y">Va bene</button>
    </div>
  </div>
</div>

<div id="rot"><div class="ico">📱</div><p>Gira il tablet<br>di lato!</p></div>

<script>
/* ==================== 00-core.js ==================== */
/* Dino Officina — core engine (shared with Dino Run and Super Dino).
   Fixed 1280x720 logical world, letterboxed. Canvas only, no assets, no deps.
   Everything a scene needs hangs off the global `G`. */
(function () {
  'use strict';

  var W = 1280, H = 720;
  var G = (window.G = { W: W, H: H, t: 0, dt: 0, frame: 0 });

  /* ---------------------------------------------------------------- palette */
  G.C = {
    leaf: '#2f8f4e', leafDark: '#1c5c33', leafLight: '#63c777', leafDeep: '#123d29',
    bark: '#7a4a26', barkDark: '#4e2f18',
    sky: '#8fd8e8', skyDeep: '#4bb6d6', sun: '#ffd75e',
    sand: '#f2d9a8', water: '#3fb6c9',
    cream: '#fff6e0', ink: '#2b1d12', shadow: 'rgba(20,10,0,.22)',
    berry: '#e8536b', plum: '#8f5bd6', tangerine: '#ff9f43', mint: '#38d9a9',
    pinkPop: '#ff6fae', blueberry: '#4d80e4',
    dino: '#57c98a', dinoDark: '#379a67', dinoBelly: '#f6e7c1'
  };

  /* ------------------------------------------------------------------ maths */
  G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  G.lerp = function (a, b, t) { return a + (b - a) * t; };
  G.ease = function (t) { t = G.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  G.easeIn = function (t) { t = G.clamp(t, 0, 1); return t * t * t; };
  G.easeInOut = function (t) { t = G.clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  G.easeBack = function (t) { t = G.clamp(t, 0, 1); var c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  G.rnd = function (a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); };
  G.rndi = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  G.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  G.shuffle = function (arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  G.dist = function (ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); };

  /* ------------------------------------------------------------- canvas fit */
  var cv = document.getElementById('c');
  var ctx = (G.ctx = cv.getContext('2d', { alpha: false }));
  var view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  G.view = view;
  var rotEl = document.getElementById('rot');

  function resize() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5, 1440 / Math.max(window.innerWidth, window.innerHeight));
    view.dpr = dpr;
    view.s = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.s) / 2;
    view.oy = (ch - H * view.s) / 2;
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    ctx.imageSmoothingEnabled = true;
    if (rotEl) rotEl.classList.toggle('on', ch > cw * 1.08);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* -------------------------------------------------------------- draw help */
  var FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif';
  G.font = function (size, weight) { return (weight || 900) + ' ' + size + 'px ' + FONT; };

  G.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    c.save();
    c.font = G.font(o.size || 32, o.weight);
    c.textAlign = o.align || 'center';
    c.textBaseline = o.baseline || 'middle';
    if (o.stroke) {
      c.lineWidth = o.strokeWidth || Math.max(4, (o.size || 32) * .16);
      c.strokeStyle = o.stroke; c.lineJoin = 'round';
      c.strokeText(str, x, y, o.maxWidth);
    }
    c.fillStyle = o.color || G.C.ink;
    c.fillText(str, x, y, o.maxWidth);
    c.restore();
  };

  G.roundRect = function (c, x, y, w, h, r) {
    r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  G.shadow = function (c, blur, color, dy) {
    c.shadowBlur = blur; c.shadowColor = color || G.C.shadow;
    c.shadowOffsetX = 0; c.shadowOffsetY = dy === undefined ? blur * .35 : dy;
  };
  G.noShadow = function (c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetX = 0; c.shadowOffsetY = 0; };

  /* ------------------------------------------------------------------ audio */
  var AC = null, master = null, noiseBuf = null;
  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = .5;
    master.connect(AC.destination);
    var n = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate), d = n.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = n;
    return AC;
  }
  G.resumeAudio = function () { var a = audio(); if (a && a.state === 'suspended') a.resume(); };

  function tone(freq, at, dur, type, gain, slideTo) {
    var a = audio(); if (!a) return;
    var t0 = a.currentTime + at;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || .22, t0 + Math.min(.02, dur * .3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(at, dur, gain, freq) {
    var a = audio(); if (!a || !noiseBuf) return;
    var t0 = a.currentTime + at;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1400; f.Q.value = .8;
    g.gain.setValueAtTime(gain || .18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }

  var SFX = {
    tap: function () { tone(680, 0, .07, 'sine', .16, 880); },
    pop: function () { tone(900, 0, .12, 'sine', .2, 420); },
    good: function () { tone(523, 0, .12, 'triangle', .2); tone(659, .09, .12, 'triangle', .2); tone(784, .18, .2, 'triangle', .22); },
    bad: function () { tone(320, 0, .16, 'sine', .16, 240); },
    coin: function () { tone(1180, 0, .07, 'square', .1); tone(1560, .06, .12, 'square', .1); },
    chime: function () { tone(1046, 0, .5, 'sine', .16); tone(1568, .02, .45, 'sine', .07); },
    whoosh: function () { noise(0, .22, .1, 900); },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * .1, .3, 'triangle', .2); });
      tone(1318, .42, .5, 'sine', .14);
    },
    hatch: function () { noise(0, .1, .12, 2400); tone(600, .08, .2, 'triangle', .18, 1000); }
  };
  G.sfx = function (name) {
    if (G.save && G.save.mute) return;
    var f = SFX[name]; if (f) { audio(); if (AC) f(); }
  };

  /* ----------------------------------------------------------------- speech */
  var voice = null, voiceTried = false;
  function findVoice() {
    if (!window.speechSynthesis) return null;
    var vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    return vs.filter(function (v) { return /^it/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) {
    speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', function () { voice = findVoice(); });
  }
  G.say = function (str, o) {
    if (!window.speechSynthesis || !str) return;
    if (G.save && G.save.mute) return;
    o = o || {};
    if (!voiceTried) { voice = findVoice(); voiceTried = true; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(str));
      u.lang = 'it-IT';
      if (voice) u.voice = voice;
      u.rate = o.rate || .95;
      u.pitch = o.pitch || 1.15;
      u.volume = o.volume === undefined ? 1 : o.volume;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is a bonus, never a blocker */ }
  };
  G.hush = function () { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------------------------------------------------------- storage */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  G.LS = LS;

  var K_ACCTS = 'do.accounts', K_LAST = 'do.last', K_SAVE = 'do.save.';

  function blankSave() {
    return {
      fruits: 0, stars: 0, mute: false, hat: null, hats: [],
      conta: {}, fili: {}, nido: {}, seen: {}, playSec: 0, updated: 0
    };
  }
  function fillSave(s) {
    var b = blankSave(), k;
    for (k in b) if (s[k] === undefined || s[k] === null) s[k] = b[k];
    return s;
  }

  G.account = null;
  G.profile = null;
  G.level = 1;
  G.save = blankSave();

  var saveTimer = 0, saveDirty = false;
  function writeSave() {
    if (!G.account) return;
    G.save.updated = Date.now();
    LS.set(K_SAVE + G.account.id, G.save);
    saveDirty = false;
    if (G.cloud && G.cloud.push) G.cloud.push();
  }
  G.saveNow = function () { saveDirty = true; };
  G.saveFlush = writeSave;

  G.accounts = {
    list: function () { return LS.get(K_ACCTS, []); },
    byId: function (id) { return G.accounts.list().filter(function (a) { return a.id === id; })[0] || null; },
    create: function (o) {
      var list = G.accounts.list();
      var acct = {
        id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        name: (o.name || 'Dino').slice(0, 14),
        color: o.color || G.C.dino,
        level: o.level === 2 ? 2 : 1,
        secret: o.secret && o.secret.length ? o.secret : null,
        created: Date.now()
      };
      list.push(acct);
      LS.set(K_ACCTS, list);
      LS.set(K_SAVE + acct.id, blankSave());
      return acct;
    },
    update: function (id, patch) {
      var list = G.accounts.list(), i;
      for (i = 0; i < list.length; i++) if (list[i].id === id) {
        for (var k in patch) list[i][k] = patch[k];
        LS.set(K_ACCTS, list);
        if (G.account && G.account.id === id) G.account = list[i];
        return list[i];
      }
      return null;
    },
    remove: function (id) {
      LS.set(K_ACCTS, G.accounts.list().filter(function (a) { return a.id !== id; }));
      LS.del(K_SAVE + id);
      if (LS.get(K_LAST, null) === id) LS.del(K_LAST);
    },
    login: function (id) {
      var a = G.accounts.byId(id);
      if (!a) return false;
      if (G.account) writeSave();
      G.account = a;
      G.profile = a.id;
      G.level = a.level;
      G.save = fillSave(LS.get(K_SAVE + id, blankSave()));
      LS.set(K_LAST, id);
      if (G.cloud && G.cloud.pull) G.cloud.pull();
      return true;
    },
    logout: function () {
      writeSave();
      G.hush();
      G.account = null; G.profile = null; G.save = blankSave();
      LS.del(K_LAST);
    },
    last: function () { return LS.get(K_LAST, null); }
  };

  /* ------------------------------------------------------------------ input */
  var pointer = { x: 0, y: 0, down: false, id: null };
  G.pointer = pointer;

  function toLogical(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.ox) / view.s,
      y: (clientY - r.top - view.oy) / view.s
    };
  }

  /* --------------------------------------------------- immediate-mode UI */
  var uiRects = [];       // registered this frame
  var uiHot = [];         // registered last frame (what the pointer tests against)
  var pressedKey = null;
  var ui = (G.ui = {});

  function rectKey(o) { return o.id || (o.label || '') + '|' + Math.round(o.x) + ',' + Math.round(o.y) + ',' + Math.round(o.w) + ',' + Math.round(o.h); }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var f = function (h) { return G.clamp(Math.round(parseInt(h, 16) + amt), 0, 255); };
    var to = function (v) { return ('0' + v.toString(16)).slice(-2); };
    return '#' + to(f(m[1])) + to(f(m[2])) + to(f(m[3]));
  }
  G.shade = shade;

  ui.button = function (o) {
    var c = o.ctx || ctx;
    var key = rectKey(o);
    var down = pressedKey === key && !o.disabled;
    var r = o.r === undefined ? Math.min(26, o.h * .32) : o.r;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.leaf);
    var dy = down ? 5 : 0;

    c.save();
    c.globalAlpha = o.disabled ? .72 : 1;
    if (o.ghost) {
      // Invisible hit area over artwork drawn by the scene (e.g. a player card).
      if (down) {
        c.fillStyle = 'rgba(20,10,0,.14)';
        G.roundRect(c, o.x, o.y, o.w, o.h, r); c.fill();
      }
    } else {
      // base (the "3d" underside)
      c.fillStyle = shade(col, -48);
      G.roundRect(c, o.x, o.y + 7, o.w, o.h, r); c.fill();
      // face
      var g = c.createLinearGradient(0, o.y + dy, 0, o.y + o.h + dy);
      g.addColorStop(0, shade(col, 26)); g.addColorStop(1, col);
      c.fillStyle = g;
      G.roundRect(c, o.x, o.y + dy, o.w, o.h, r); c.fill();
      // gloss
      c.fillStyle = 'rgba(255,255,255,.20)';
      G.roundRect(c, o.x + o.w * .06, o.y + dy + o.h * .10, o.w * .88, o.h * .30, r * .7); c.fill();
    }

    var cx = o.x + o.w / 2, cy = o.y + dy + o.h / 2;
    if (o.icon) {
      var isz = o.iconSize || Math.min(o.w, o.h) * .52;
      o.icon(c, o.label ? o.x + o.h * .58 : cx, cy, isz);
    }
    if (o.label) {
      var tx = o.icon ? cx + o.h * .26 : cx;
      G.text(o.label, tx, o.sub ? cy - o.h * .12 : cy, {
        ctx: c, size: o.fontSize || Math.min(o.h * .40, 46),
        color: o.textColor || '#fff', stroke: o.outline || 'rgba(0,0,0,.22)',
        maxWidth: o.w - (o.icon ? o.h * .9 : o.w * .12)
      });
      if (o.sub) G.text(o.sub, tx, cy + o.h * .24, { ctx: c, size: o.h * .21, color: 'rgba(255,255,255,.9)', weight: 700 });
    }
    c.restore();

    if (!o.disabled) uiRects.push({ key: key, x: o.x, y: o.y, w: o.w, h: o.h, onTap: o.onTap, silent: o.silent, round: false });
    return down;
  };

  ui.round = function (o) {
    var c = o.ctx || ctx;
    var key = o.id || 'r' + Math.round(o.x) + ',' + Math.round(o.y);
    var down = pressedKey === key && !o.disabled;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.cream);
    var dy = down ? 4 : 0;
    c.save();
    c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
    c.fillStyle = shade(col, -50);
    c.beginPath(); c.arc(o.x, o.y + 6, o.r, 0, 7); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.arc(o.x, o.y + dy, o.r, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)';
    c.beginPath(); c.arc(o.x, o.y + dy - o.r * .22, o.r * .74, Math.PI, 0); c.fill();
    if (o.icon) o.icon(c, o.x, o.y + dy, o.r * 1.05);
    c.restore();
    if (!o.disabled) uiRects.push({ key: key, x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2, onTap: o.onTap, silent: o.silent, round: true, cx: o.x, cy: o.y, cr: o.r });
    return down;
  };

  function hitTest(p) {
    var i, r;
    for (i = uiHot.length - 1; i >= 0; i--) {
      r = uiHot[i];
      if (r.round) { if (G.dist(p.x, p.y, r.cx, r.cy) <= r.cr + 12) return r; }
      else if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return r;
    }
    return null;
  }

  /* ----------------------------------------------------------------- scenes */
  var scenes = {};
  var cur = null, curName = '';
  var fade = { a: 0, dir: 0, next: null, params: null };
  G.current = '';

  G.scene = function (name, obj) { scenes[name] = obj; obj._name = name; return obj; };
  G.go = function (name, params) {
    if (!scenes[name]) { console.warn('scena assente:', name); return; }
    if (fade.dir === 1) return;                 // a transition is already under way
    fade.dir = 1; fade.next = name; fade.params = params || null;
    G.hush();
  };

/* ==================== 05-migrate.js ==================== */
/* The old Dino Officina ran on its own small engine and kept its children in
   'dino-officina.profiles'. The new one shares the engine of Dino Run and
   Super Dino ('do.' keys). On the first start we carry every child over —
   same id, name, colour, age and three-figure secret — so nobody has to make
   their dino again, and the stars they earned come along. Runs once. */
(function () {
  'use strict';
  try {
    if (localStorage.getItem('do.accounts')) return;
    var old = JSON.parse(localStorage.getItem('dino-officina.profiles') || '[]');
    if (!Array.isArray(old) || !old.length) return;
    var list = old.map(function (p) {
      return { id: p.id, name: String(p.name || 'Dino').slice(0, 14), color: p.color || G.C.dino, level: p.level === 2 ? 2 : 1,
        secret: p.secret && p.secret.length === 3 ? p.secret : null, created: p.created || Date.now() };
    });
    list.forEach(function (p) {
      var prev = {};
      try { prev = JSON.parse(localStorage.getItem('dino-officina.save.' + p.id) || '{}') || {}; } catch (e) {}
      localStorage.setItem('do.save.' + p.id, JSON.stringify({ fruits: 0, stars: Math.max(0, prev.stars | 0), mute: !!prev.mute, hat: null, hats: [], conta: {}, fili: {}, nido: {}, seen: {}, playSec: 0, updated: 0 }));
    });
    localStorage.setItem('do.accounts', JSON.stringify(list));
    var last = localStorage.getItem('dino-officina.last');
    if (last) localStorage.setItem('do.last', JSON.stringify(last));
  } catch (e) { /* a broken old save must never stop the game from starting */ }
})();


/* ==================== 10-veicolo.js ==================== */
/* The vehicle: four slots, and every piece changes how it drives.
     telaio  auto (fast on land) | barca (floats, a bit slower on land)
     ruote   piccole (fast, climbs little) | grandi (climbs hills) | cingoli (climbs anything, slow)
     motore  normale | turbo (faster, a little more grip) | elica (pushes in water)
     extra   niente | razzo (button: thrust) | ali (glide) | palloncini (light) | molla (button: jump)
   The numbers are what the courses are built around: a 'ripida' hill is 26°,
   piccole hold 16° (21° with the turbo), grandi 30°, cingoli 44°. */
(function () {
  'use strict';
  var C = G.C;
  var SLOTS = ['telaio', 'ruote', 'motore', 'extra'];
  var PARTS = {
    telaio: [{ id: 'auto', name: 'Macchina' }, { id: 'barca', name: 'Barca' }],
    ruote: [{ id: 'piccole', name: 'Ruote piccole' }, { id: 'grandi', name: 'Ruote giganti' }, { id: 'cingoli', name: 'Cingoli' }],
    motore: [{ id: 'normale', name: 'Motore' }, { id: 'turbo', name: 'Turbo' }, { id: 'elica', name: 'Elica' }],
    extra: [{ id: 'niente', name: 'Niente' }, { id: 'razzo', name: 'Razzo' }, { id: 'ali', name: 'Ali' }, { id: 'palloncini', name: 'Palloncini' }, { id: 'molla', name: 'Molla' }]
  };
  var WHEEL_R = { piccole: 19, grandi: 31, cingoli: 22 };

  function stats(v) {
    var w = v.ruote, m = v.motore;
    return {
      speed: 330 * ({ piccole: 1.15, grandi: .95, cingoli: .7 })[w] * ({ normale: 1, turbo: 1.35, elica: .85 })[m] * (v.telaio === 'barca' ? .88 : 1) * (v.extra === 'palloncini' ? .9 : 1),
      accel: 430 * ({ normale: 1, turbo: 1.3, elica: .9 })[m],
      climb: ({ piccole: 16, grandi: 30, cingoli: 44 })[w] + (m === 'turbo' ? 5 : 0),
      floats: v.telaio === 'barca', swim: m === 'elica' ? 1.15 : .6,
      gravity: v.extra === 'palloncini' ? .55 : 1, glide: v.extra === 'ali', rocket: v.extra === 'razzo', spring: v.extra === 'molla',
      wheel: WHEEL_R[w]
    };
  }

  /* ---------------------------------------------------------------- drawing
     (x, y) = the ground under the middle of the vehicle; s = scale (1 = road size). */
  function wheel(c, x, y, r, rot) {
    c.fillStyle = '#2b2b33'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.fillStyle = '#c9ced4'; c.beginPath(); c.arc(x, y, r * .5, 0, 7); c.fill();
    c.strokeStyle = '#6e7780'; c.lineWidth = r * .14;
    for (var k = 0; k < 3; k++) { var a = rot + k * 2.094; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5); c.stroke(); }
  }
  function drawVehicle(c, v, x, y, o) {
    o = o || {};
    var s = o.s || 1, ang = o.ang || 0, rot = o.rot || 0, t = o.t || G.t, col = o.color || (G.account && G.account.color) || C.dino;
    var r = WHEEL_R[v.ruote] || 20, bodyY = -r - 8;
    if (!v.telaio || !v.ruote) return drawPartial(c, v, x, y, s, ang, rot, t, col, r, bodyY, o);
    c.save(); c.translate(x, y); c.scale(s, s); c.rotate(ang);
    if (o.ghost) c.globalAlpha = .28;
    // palloncini above everything else, on strings
    if (v.extra === 'palloncini') {
      [[-30, -150, C.berry], [8, -168, C.sun], [40, -146, C.blueberry]].forEach(function (b, i) {
        var bob = Math.sin(t * 2 + i) * 4;
        c.strokeStyle = '#6e7780'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, bodyY - 40); c.lineTo(b[0], b[1] + 26 + bob); c.stroke();
        c.fillStyle = b[2]; c.beginPath(); c.ellipse(b[0], b[1] + bob, 20, 25, 0, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(b[0] - 7, b[1] - 8 + bob, 5, 8, -.4, 0, 7); c.fill();
      });
    }

/* Accounts: who is playing. Each child gets their own dino, their own save and
   an optional 3-icon "secret" instead of a password — a 3-year-old cannot type

(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;

  var COLORS = [C.dino, C.blueberry, C.pinkPop, C.tangerine, C.plum, C.water];

    { shape: 'quadrato', color: C.blueberry, name: 'quadrato blu' },
    { shape: 'triangolo', color: C.mint, name: 'triangolo verde' },
    { shape: 'cuore', color: C.pinkPop, name: 'cuore rosa' },
    { shape: 'stella', color: C.sun, name: 'stella gialla' },
    { shape: 'fiore', color: C.plum, name: 'fiore viola' },
    { shape: 'luna', color: C.tangerine, name: 'luna arancione' },
    { shape: 'rombo', color: C.water, name: 'rombo azzurro' },
    { shape: 'quadrato', color: C.leafLight, name: 'quadrato verde' }

  function secretIcon(c, x, y, r, i) {
    var k = SECRET_KEYS[i % SECRET_KEYS.length];
    var f = window.A && A.SHAPES && A.SHAPES[k.shape];
    if (f) { f(c, x, y, r, k.color); return; }
    c.save(); c.fillStyle = k.color; c.strokeStyle = C.ink; c.lineWidth = 4;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.stroke(); c.restore();
  }

  /* `gear` is a look object from G.look (see 01c-art-gear.js). Pass one when
     drawing SOMEBODY ELSE'S dino; pass nothing for the current player and
     A.dino resolves the current save itself.
     Every account gets its OWN buffer — this screen draws up to five dinos in
     a single frame, and a shared one would put the last child's hat on all of
     them. To a three-year-old that is not a glitch, that is a theft. */

        icon: function (cc, x, yy, r) {

      }

      G.ui.button({
        x: 40, y: H - 108, w: 250, h: 84, r: 24, color: C.bark, label: 'Indietro',
        onTap: function () { G.go('accesso'); }
      });
      if (sg.fails >= 3) {
        G.ui.button({
          x: 320, y: H - 108, w: 320, h: 84, r: 24, color: C.tangerine, label: 'Chiedi a un grande',
          fontSize: 28,
          onTap: function () { G.go('gate', { then: '@login', arg: a.id, back: 'segreto', backArg: { id: a.id } }); }
        });
      }
    }
  });

  /* --------------------------------------------------------- scene: nuovo */
  var nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };

  G.scene('nuovo', {
    hud: false, back: false,
    enter: function () {
      nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };
      G.prompt('Come ti chiami?', '', function (v) {
        if (v === null || !v) { G.go('accesso'); return; }
        nu.name = v.slice(0, 14);
        nu.step = 1;
        G.say('Ciao ' + nu.name + '! Di che colore e il tuo dino?');
      });
    },
    draw: function (c) {
      backdrop(c, null);
      var titles = ['', 'Scegli il colore', 'Quanti anni hai?', 'Scegli il tuo segreto'];
      G.text(titles[nu.step] || '', W / 2, 74, { size: 52, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 11 });

      if (nu.step === 1) {
        dinoPreview(c, W / 2, 430, 240, nu.color);
        G.text(nu.name, W / 2, 470, { size: 40, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 9 });
        var bw = 128, bg = 18, tot = COLORS.length * bw + (COLORS.length - 1) * bg, x0 = (W - tot) / 2;
        COLORS.forEach(function (col, i) {
          G.ui.button({
            id: 'col' + i, x: x0 + i * (bw + bg), y: 150, w: bw, h: 116, r: 24, color: col,
            icon: function (cc, cx, cy) {
              if (nu.color === col) {
                cc.save(); cc.strokeStyle = '#fff'; cc.lineWidth = 8; cc.lineCap = 'round'; cc.lineJoin = 'round';
                cc.beginPath(); cc.moveTo(cx - 22, cy); cc.lineTo(cx - 6, cy + 18); cc.lineTo(cx + 24, cy - 18); cc.stroke(); cc.restore();
              }
            },
            onTap: function () { nu.color = col; G.sfx('pop'); }
          });
        });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 2; G.say('Quanti anni hai?'); } });
      }

      if (nu.step === 2) {
        [{ lv: 1, t: 'Piccolo', s: '3 - 4 anni', col: C.tangerine }, { lv: 2, t: 'Grande', s: '5 - 7 anni', col: C.blueberry }]
          .forEach(function (o, i) {
            var x = W / 2 - 340 + i * 360;
            G.ui.button({
              id: 'lv' + o.lv, x: x, y: 180, w: 320, h: 300, r: 30,
              color: nu.level === o.lv ? o.col : G.shade(o.col, 40),
              label: o.t, sub: o.s, fontSize: 52,
              onTap: function () { nu.level = o.lv; G.sfx('pop'); }
            });
          });
        G.text(nu.level === 1 ? 'Giochi piu semplici, tutto raccontato a voce'
          : 'Somme, sottrazioni e griglie piu grandi',
          W / 2, 528, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 3; G.say('Scegli tre figure: sara il tuo segreto.'); } });
      }

      if (nu.step === 3) {
        G.text('Tocca 3 figure e ricordale bene', W / 2, 132, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        var i;
        for (i = 0; i < 3; i++) {
          var sx = W / 2 + (i - 1) * 90, sy = 196;
          c.save(); c.fillStyle = 'rgba(255,246,224,.32)';
          c.beginPath(); c.arc(sx, sy, 32, 0, 7); c.fill(); c.restore();
          if (nu.secret[i] !== undefined) secretIcon(c, sx, sy, 25, nu.secret[i]);
        }
        var px = W / 2 - 236, py = 254, cell = 140, gap = 16;
        for (i = 0; i < 9; i++) {
          (function (idx) {
            var bx = px + (idx % 3) * (cell + gap), by = py + Math.floor(idx / 3) * (cell + gap);
            G.ui.button({
              id: 'nk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
              disabled: nu.secret.length >= 3,
              icon: function (cc, cx, cy) { secretIcon(cc, cx, cy, cell * .29, idx); },
              onTap: function () { nu.secret.push(idx); G.sfx('pop'); }
            });
          })(i);
        }
        G.ui.button({
          x: 40, y: H - 116, w: 260, h: 92, r: 26, color: C.bark, label: 'Rifai', fontSize: 34,
          onTap: function () { nu.secret = []; }
        });
        G.ui.button({
          x: W - 300, y: H - 116, w: 260, h: 92, r: 26, color: C.leafDark, label: 'Senza segreto', fontSize: 24,
          onTap: function () { nu.secret = []; finish(); }
        });
        if (nu.secret.length === 3) {
          G.ui.button({
            x: W / 2 - 170, y: H - 116, w: 340, h: 92, r: 26, color: C.leaf, label: 'Fatto!', onTap: finish
          });
        }
      }
    }
  });

  function finish() {
    var a = G.accounts.create({ name: nu.name, color: nu.color, level: nu.level, secret: nu.secret.length === 3 ? nu.secret : null });
    (G.familyLogin || G.accounts.login)(a.id);
    G.fx.confetti(); G.sfx('win');
    G.go('menu');
    setTimeout(function () { G.say('Buon divertimento, ' + a.name + '!'); }, 900);
  }

  /* ---------------------------------------------------------- scene: gate */
  var gt = { a: 0, b: 0, typed: '', then: null, arg: null, back: 'giungla', backArg: null, shake: 0 };

  G.scene('gate', {
    hud: false, back: false,
    enter: function (p) {
      p = p || {};
      gt.a = G.rndi(6, 9); gt.b = G.rndi(6, 9);
      gt.typed = ''; gt.shake = 0;
      gt.then = !p.then || p.then==='genitori' ? 'family-settings' : p.then; gt.arg = p.arg || null;
      gt.back = p.back || 'giungla'; gt.backArg = p.backArg || null;
    },
    update: function (dt) { if (gt.shake > 0) gt.shake = Math.max(0, gt.shake - dt * 4); },
    draw: function (c) {
      backdrop(c, null);
      c.save(); c.fillStyle = 'rgba(8,26,18,.5)'; c.fillRect(0, 0, W, H); c.restore();

      G.text('Solo per i grandi', W / 2, 96, { size: 50, color: C.cream, stroke: 'rgba(0,0,0,.5)', strokeWidth: 10 });

      var jitter = gt.shake > 0 ? Math.sin(G.t * 48) * gt.shake * 12 : 0;
      c.save();
      if (window.A && A.panel) A.panel(c, 150 + jitter, 176, 460, 300, { r: 28 });
      else { c.fillStyle = C.cream; G.roundRect(c, 150 + jitter, 176, 460, 300, 28); c.fill(); }
      c.restore();
      G.text(gt.a + ' × ' + gt.b + ' = ?', 380 + jitter, 268, { size: 72, color: C.ink });
      c.save();
      c.fillStyle = '#fffdf6'; c.strokeStyle = '#cdb389'; c.lineWidth = 5;
      G.roundRect(c, 220 + jitter, 336, 320, 96, 20); c.fill(); c.stroke();
      c.restore();
      G.text(gt.typed || '–', 380 + jitter, 386, { size: 58, color: C.ink });

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
      var kx = 700, ky = 168, kw = 150, kh = 116, kg = 14;
      keys.forEach(function (k, i) {
        var x = kx + (i % 3) * (kw + kg), y = ky + Math.floor(i / 3) * (kh + kg);
        G.ui.button({
          id: 'g' + k, x: x, y: y, w: kw, h: kh, r: 22,
          color: k === 'OK' ? C.leaf : k === 'C' ? C.berry : C.cream,
          textColor: (k === 'OK' || k === 'C') ? '#fff' : C.ink,
          outline: (k === 'OK' || k === 'C') ? 'rgba(0,0,0,.2)' : 'rgba(0,0,0,0)',
          label: k, fontSize: 44,
          onTap: function () {
            if (k === 'C') { gt.typed = ''; return; }
            if (k === 'OK') {
              if (parseInt(gt.typed, 10) === gt.a * gt.b) {
                G.sfx('good');
                if (gt.then === '@login') { (G.familyLogin || G.accounts.login)(gt.arg); G.go('menu'); }
                else G.go(gt.then, gt.arg);
              } else { gt.shake = 1; gt.typed = ''; G.sfx('bad'); }
              return;
            }
            if (gt.typed.length < 3) gt.typed += k;
          }
        });
      });

      G.ui.button({
        x: 150, y: H - 108, w: 300, h: 84, r: 24, color: C.bark, label: 'Annulla',
        onTap: function () { G.go(gt.back, gt.backArg); }
      });
    }
  });


  G.scene('genitori',{hud:false,enter:function(){G.go('gate',{then:'family-settings'});}});
  G.scene('family-settings', {hud:false,back:false,draw:function(c){
    backdrop(c,'Impostazioni');
    var a=G.account;
    if(a) {
      dinoPreview(c,340,470,230,a.color);
      G.text(a.name,340,510,{size:40,color:C.cream});
      G.ui.button({id:'family-age',x:650,y:190,w:460,h:100,color:C.water,label:G.level===1?'Piccolo · 3–4 anni':'Grande · 5–7 anni',onTap:function(){G.level=G.level===1?2:1;G.accounts.update(a.id,{level:G.level});G.saveNow();}});
      G.ui.button({id:'family-color',x:650,y:315,w:460,h:100,color:C.tangerine,label:'Cambia colore',onTap:function(){G.accounts.update(a.id,{color:COLORS[(COLORS.indexOf(a.color)+1)%COLORS.length]});}});
    }
    G.ui.button({id:'family-switch',x:650,y:440,w:460,h:100,color:C.blueberry,label:'Cambia giocatore',onTap:function(){G.accounts.logout();G.go('accesso');}});
    G.ui.button({id:'family-back',x:650,y:565,w:460,h:100,color:C.leaf,label:'Torna al gioco',onTap:function(){G.go(G.account?'menu':'accesso');}});
  }});
})();


/* ==================== 99-boot.js ==================== */
/* Boot: tablet niceties, then "chi guida?".

   Per un pezzo qui veniva creato un profilo in silenzio, perche' il gioco non
   aveva ancora niente da ricordare. Adesso ne ha: giro migliore per pista,
   vittorie, difficolta', colore del kart. Due bambini sullo stesso tablet
   vogliono due elenchi di record, non uno mescolato — quindi si comincia da
   dove si comincia in Dino Giungla, e per la stessa ragione. */
(function () {
  'use strict';

  G.toggleFullscreen = function () {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
      }
    } catch (e) { /* desktop browsers may refuse; harmless */ }
  };

  var askedFullscreen = false;
  function firstTouch() {
    G.resumeAudio();
    if (!askedFullscreen) {
      askedFullscreen = true;
      if (matchMedia('(pointer: coarse)').matches && !document.fullscreenElement) G.toggleFullscreen();
    }
    keepAwake();
  }
  window.addEventListener('pointerdown', firstTouch, { once: false, passive: true });

  var lock = null;
  function keepAwake() {
    if (lock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      l.addEventListener('release', function () { lock = null; });
    }).catch(function () { lock = null; });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) keepAwake();
  });

  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) {} }

  /* The engine came from a game whose home is a jungle. Here it is the menu, and
     without this the back button would call G.go on a scene that does not exist. */
  G.home = function () { G.go(G.account ? 'menu' : 'accesso'); };

  /* Si passa SEMPRE dalla schermata dei piloti, anche con un profilo solo:
     e' li' che l'altro fratello si accorge di poterne fare uno suo. */
  G.start('accesso');
})();
</script>
