<!doctype html>
<html lang="it">
<head>

<meta name="theme-color" content="#163c45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Dino Officina</title>

<style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#102e35; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
#c { position:fixed; inset:0; display:block; touch-action:none; }
#rot { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#163c45; color:#fff5dc; text-align:center; }
#rot.on { display:flex; }
#rot .ico { font-size:90px; }
#rot p { margin:0; font-size:28px; font-weight:900; }
.profile-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,43,51,.78);color:#26343a;touch-action:auto}.profile-overlay.on{display:flex}.profile-dialog{width:min(760px,94vw);min-height:480px;padding:34px 46px 38px;border:8px solid #435b63;border-radius:34px;background:#fff5dc;box-shadow:0 14px 0 rgba(20,25,25,.24);text-align:center}.profile-dialog h1{margin:0 0 6px;color:#ef8b45;font-size:clamp(30px,5vw,52px);line-height:1.05}.profile-dialog p{margin:8px 0 20px;font-size:clamp(19px,3vw,28px);font-weight:800}.profile-step.hidden{display:none}.profile-step label{display:block;margin:16px 0 10px;font-size:24px;font-weight:900}.profile-step input{display:block;width:min(540px,90%);margin:0 auto 24px;padding:14px 18px;border:5px solid #6e8790;border-radius:18px;background:#fff;color:#26343a;font:900 30px system-ui,sans-serif;text-align:center}.profile-dialog button{min-width:180px;min-height:70px;margin:8px;padding:10px 20px;border:4px solid rgba(38,52,58,.55);border-radius:20px;background:#48b878;color:#fff5dc;font:900 22px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}.profile-dialog button:active{transform:translateY(3px)}.profile-colors,.profile-levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px auto 18px}.profile-colors button{min-width:90px;font-size:42px;line-height:1}.profile-levels button{min-width:220px;background:#6e8790}.profile-levels button.selected{background:#ef8b45}.profile-levels small{font-size:15px}.profile-shapes{max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px auto 18px}.profile-shapes button{min-width:70px;min-height:70px;margin:0;padding:0;background:#9b6dcc;font-size:35px}.profile-shapes button.selected{background:#ffcb4c;color:#26343a}#profile-secret-status{min-height:28px;font-size:20px;font-weight:900}#profile-skip-secret{background:#6e8790}

#family-name-dialog{display:none;position:fixed;inset:0;background:#123c35dd;align-items:center;justify-content:center;z-index:50}#family-name-dialog.open{display:flex}#family-name-dialog>div{background:#fff5dc;padding:32px;border-radius:28px;width:min(520px,90vw);color:#26343a}#family-name-dialog label{display:block;font-size:30px}#family-name-dialog input{display:block;box-sizing:border-box;width:100%;font-size:28px;margin:20px 0;padding:16px}#family-name-dialog button{min-height:64px;font-size:24px;padding:12px 24px;margin-right:12px;border:0;border-radius:16px;background:#48b878;color:#102f28}</style>

<body>
<canvas id="c" aria-label="Dino Officina"></canvas>
<div id="profile-overlay" class="profile-overlay" aria-hidden="true"><section class="profile-dialog" role="dialog" aria-labelledby="profile-title">
<h1 id="profile-title">Nuovo dino</h1><p id="profile-copy">Cominciamo insieme</p>
<div class="profile-step" id="profile-step-name"><label for="profile-name">Come si chiama?</label><input id="profile-name" maxlength="18" autocomplete="off" value="Dino"><button id="profile-next-name" type="button">AVANTI</button><button id="profile-cancel" type="button">ANNULLA</button></div>
<div class="profile-step hidden" id="profile-step-color"><p>Scegli un colore</p><div class="profile-colors"><button type="button" data-color="#48b878">●</button><button type="button" data-color="#ef735d">●</button><button type="button" data-color="#4e9ed6">●</button><button type="button" data-color="#ef8b45">●</button></div><button id="profile-next-color" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-level"><p>Quanti anni ha il dino?</p><div class="profile-levels"><button id="profile-level-small" type="button">PICCOLO<br><small>3–4 anni</small></button><button id="profile-level-big" type="button">GRANDE<br><small>5–7 anni</small></button></div><button id="profile-next-level" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-secret"><p>Scegli 3 figure, oppure salta</p><div class="profile-shapes"><button type="button" data-shape="0">♥</button><button type="button" data-shape="1">★</button><button type="button" data-shape="2">☾</button><button type="button" data-shape="3">●</button><button type="button" data-shape="4">◆</button><button type="button" data-shape="5">✿</button><button type="button" data-shape="6">☀</button><button type="button" data-shape="7">▲</button><button type="button" data-shape="8">■</button></div><div id="profile-secret-status">0 / 3</div><button id="profile-skip-secret" type="button">SENZA SEGRETO</button><button id="profile-create" type="button">CREA PROFILO</button></div>
</section></div>
<div id="rot"><div class="ico">↻</div><p>Gira il tablet<br>di lato!</p></div>

<div id="family-name-dialog" role="dialog" aria-modal="true" aria-labelledby="family-name-label"><div><label id="family-name-label" for="family-name-input">Come ti chiami?</label><input id="family-name-input" maxlength="14" autocomplete="off"><button id="family-name-cancel">Annulla</button><button id="family-name-ok">Va bene</button></div></div>

  function clean(s){var b=blank(),k;if(!s||typeof s!=='object'||Array.isArray(s))return b;for(k in b)if(s[k]===undefined||s[k]===null)s[k]=b[k];if(typeof s.done!=='object'||Array.isArray(s.done))s.done={};if(typeof s.stars!=='number'||!isFinite(s.stars)||s.stars<0)s.stars=0;s.stars=Math.floor(s.stars);return s;}

/* ===== 01-art.js ===== */
/* Pezzi e macchine: forme originali disegnate a canvas. */
(function(){'use strict';var c=G.ctx,C=G.C,T=G.TAU;
  function bolt(x,y,r){c.fillStyle=C.cream;c.beginPath();c.arc(x,y,r,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=Math.max(2,r*.3);c.stroke();c.beginPath();c.moveTo(x-r*.55,y);c.lineTo(x+r*.55,y);c.stroke();}

    if(type==='cab'){G.roundRect(-50*scale,-35*scale,100*scale,70*scale,13*scale);c.fill();c.stroke();c.fillStyle='#aee6ef';G.roundRect(-28*scale,-23*scale,56*scale,34*scale,7*scale);c.fill();c.stroke();}
    if(type==='arm'){G.roundRect(-18*scale,-70*scale,36*scale,140*scale,12*scale);c.fill();c.stroke();[-48,0,48].forEach(function(q){bolt(0,q*scale,7*scale);});}
    if(type==='hook'){c.strokeStyle=color;c.lineWidth=20*scale;c.beginPath();c.moveTo(0,-45*scale);c.lineTo(0,20*scale);c.arc(22*scale,20*scale,22*scale,Math.PI,0);c.stroke();c.strokeStyle=C.ink;c.lineWidth=5*scale;c.stroke();}

    if(type==='bucket'){c.beginPath();c.moveTo(-50*scale,-30*scale);c.lineTo(48*scale,-18*scale);c.lineTo(34*scale,36*scale);c.lineTo(-34*scale,36*scale);c.closePath();c.fill();c.stroke();[-24,0,24].forEach(function(q){c.beginPath();c.moveTo(q*scale,34*scale);c.lineTo(q*scale,52*scale);c.stroke();});}
    if(type==='sail'){c.beginPath();c.moveTo(0,-70*scale);c.lineTo(0,55*scale);c.lineTo(70*scale,42*scale);c.closePath();c.fill();c.stroke();bolt(0,54*scale,7*scale);}
    if(type==='rocket'){c.beginPath();c.moveTo(0,-76*scale);c.quadraticCurveTo(48*scale,-25*scale,35*scale,48*scale);c.lineTo(0,70*scale);c.lineTo(-35*scale,48*scale);c.quadraticCurveTo(-48*scale,-25*scale,0,-76*scale);c.closePath();c.fill();c.stroke();c.fillStyle='#aee6ef';c.beginPath();c.arc(0,-18*scale,14*scale,0,T);c.fill();c.stroke();}
    if(type==='antenna'){c.strokeStyle=color;c.lineWidth=13*scale;c.beginPath();c.moveTo(0,55*scale);c.lineTo(0,-38*scale);c.stroke();c.fillStyle=color;c.beginPath();c.arc(0,-52*scale,18*scale,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=5*scale;c.stroke();}
    if(type==='chimney'){G.roundRect(-25*scale,-58*scale,50*scale,116*scale,10*scale);c.fill();c.stroke();G.roundRect(-39*scale,-67*scale,78*scale,26*scale,8*scale);c.fill();c.stroke();}

    if(type==='claw'){c.strokeStyle=color;c.lineWidth=17*scale;c.beginPath();c.moveTo(0,-52*scale);c.lineTo(0,8*scale);c.moveTo(0,8*scale);c.quadraticCurveTo(-48*scale,15*scale,-42*scale,52*scale);c.moveTo(0,8*scale);c.quadraticCurveTo(48*scale,15*scale,42*scale,52*scale);c.stroke();c.strokeStyle=C.ink;c.lineWidth=4*scale;c.stroke();bolt(0,6*scale,7*scale);}

  function drawMachine(offset){offset=offset||0;for(var i=0;i<S.m.slots.length;i++){var sl=S.m.slots[i],p=S.placed[i];if(!p)drawSlot(sl,i);else G.drawPiece(p.type,sl[1]+offset,sl[2]+(S.state==='testing'&&!S.result?Math.sin(G.t*23+i)*7:0),.88,p.color,1,sl[3]);}}

    G.panel(245,126,690,402,'rgba(255,245,220,.93)',32);c.fillStyle='#9a7854';c.fillRect(270,500,640,25);c.fillStyle='#694b34';c.fillRect(310,525,34,63);c.fillRect(840,525,34,63);

    if(S.drag)G.drawPiece(S.drag.piece.type,S.drag.x,S.drag.y,1,S.drag.piece.color,.9);
  }});
  G.officinaState=function(){return{id:S.id,family:S.m.family||null,state:S.state,count:completeCount(),wrong:S.wrong.slice(),stars:G.save.stars};};

/* ===== 90-account.js ===== */
/* Dino Officina — profili locali. The profile gate is small on purpose: it
   keeps siblings' progress separate without adding libraries or a server. */
(function () {
  'use strict';
  var C = G.C, W = G.W, H = G.H;
  var list = G._profiles || [], pending = null;
  var draft = { name: 'Dino', color: C.green, level: 1, secret: [] };
  var secretShapes = ['♥', '★', '☾', '●', '◆', '✿', '☀', '▲', '■'];
  var gate = { hold: 0, unlocked: false };

  function persist() { try { localStorage.setItem(G._profilesKey, JSON.stringify(list)); } catch (e) {} }
  function idFor() { return 'p-' + Date.now().toString(36) + '-' + G.rndi(100, 999); }
  function nameFor() { return draft.name; }
  function profile(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  var overlay = null, wizardBound = false, wizardStep = 0;
  function el(id) { try { return document.getElementById(id); } catch (e) { return null; } }
  function hideWizard() { overlay = overlay || el('profile-overlay'); if (overlay && overlay.classList) { overlay.classList.remove('on'); if (overlay.setAttribute) overlay.setAttribute('aria-hidden', 'true'); } }
  function showStep(n) {
    wizardStep = n; var ids = ['name', 'color', 'level', 'secret'], i, node;
    for (i = 0; i < ids.length; i++) { node = el('profile-step-' + ids[i]); if (node && node.classList) node.classList.toggle('hidden', i !== n); }
    var title = el('profile-title'), copy = el('profile-copy');
    if (title) title.textContent = ['Nuovo dino', 'Il suo colore', 'Piccolo o Grande?', 'Un segreto per il dino'][n];
    if (copy) copy.textContent = ['Creiamo il suo profilo', 'Scegli un colore allegro', 'Potrai cambiarlo dai genitori', 'Tre figure in ordine, oppure salta'][n];
  }
  function finishWizard() { var p = G.accounts.create(draft); hideWizard(); G._profileLogin(p.id); G.go('menu'); }
  function bindWizard() {
    overlay = el('profile-overlay'); if (!overlay || wizardBound || !overlay.querySelector) return;
    wizardBound = true;
    el('profile-cancel').addEventListener('click', function () { hideWizard(); G.go('accesso'); });
    el('profile-next-name').addEventListener('click', function () { var input = el('profile-name'); draft.name = String((input && input.value) || 'Dino').trim().slice(0, 18) || 'Dino'; showStep(1); });
    var colors = overlay.querySelectorAll('[data-color]'); colors.forEach(function (b) { b.addEventListener('click', function () { draft.color = b.getAttribute('data-color'); colors.forEach(function (q) { q.classList.remove('selected'); }); b.classList.add('selected'); }); });
    el('profile-next-color').addEventListener('click', function () { showStep(2); });
    el('profile-level-small').addEventListener('click', function () { draft.level = 1; el('profile-level-small').classList.add('selected'); el('profile-level-big').classList.remove('selected'); });
    el('profile-level-big').addEventListener('click', function () { draft.level = 2; el('profile-level-big').classList.add('selected'); el('profile-level-small').classList.remove('selected'); });
    el('profile-next-level').addEventListener('click', function () { showStep(3); });
    var shapes = overlay.querySelectorAll('[data-shape]'); shapes.forEach(function (b) { b.addEventListener('click', function () { var v = Number(b.getAttribute('data-shape')), at = draft.secret.indexOf(v); if (at >= 0) draft.secret.splice(at, 1); else if (draft.secret.length < 3) draft.secret.push(v); b.classList.toggle('selected', draft.secret.indexOf(v) >= 0); var status = el('profile-secret-status'); if (status) status.textContent = draft.secret.length + ' / 3'; }); });
    el('profile-skip-secret').addEventListener('click', function () { draft.secret = []; finishWizard(); });
    el('profile-create').addEventListener('click', function () { if (draft.secret.length !== 3) { G.say('Scegli tre figure, oppure tocca senza segreto.'); return; } finishWizard(); });
    showStep(0);
  }
  function showWizard() { bindWizard(); if (!overlay) return; if (overlay.classList) overlay.classList.add('on'); if (overlay.setAttribute) overlay.setAttribute('aria-hidden', 'false'); var input = el('profile-name'); if (input) input.value = draft.name; showStep(0); }

  G.accounts = {
    list: function () { return list.slice(); },
    create: function (o) {
      o = o || {}; var p = { id: o.id || idFor(), name: String(o.name || 'Dino').slice(0, 18), color: o.color || C.green, level: o.level === 2 ? 2 : 1, secret: Array.isArray(o.secret) ? o.secret.slice(0, 3) : [], created: Date.now() };
      list.push(p); persist();
      try { localStorage.setItem('dino-officina.save.' + p.id, JSON.stringify(G._blankSave())); } catch (e) {}
      return p;
    },
    update: function (id, patch) { var p = profile(id); if (!p) return null; patch = patch || {}; if (patch.name) p.name = String(patch.name).slice(0, 18); if (patch.color) p.color = patch.color; if (patch.level === 1 || patch.level === 2) p.level = patch.level; if (Array.isArray(patch.secret)) p.secret = patch.secret.slice(0, 3); persist(); if (G.account && G.account.id === id) { G.account = p; G.level = p.level; G.save.level = G.level; G.saveNow(); } return p; },
    remove: function (id) { var p = profile(id); if (!p) return false; list.splice(list.indexOf(p), 1); persist(); try { localStorage.removeItem('dino-officina.save.' + id); } catch (e) {} if (G.account && G.account.id === id) { G._profileLogout(); G.go('accesso'); } return true; },
    login: function (id) { var p = profile(id); if (!p) return false; if (p.secret && p.secret.length) { pending = p.id; G.go('segreto'); return true; } G._profileLogin(id); G.go('menu'); return true; },

(function(){'use strict';

  var create=G.accounts.create;
  G.accounts.create=function(o){var p=create(o);p.secretVersion=2;try{localStorage.setItem(G._profilesKey,JSON.stringify(G._profiles));}catch(e){}return p;};
  G.hush=function(){if(window.speechSynthesis)speechSynthesis.cancel();};
  G.shake=function(){};
  G.fx={confetti:function(){}};
  var button=G.ui.button,text=G.text;
  G.text=function(s,x,y,o){o=Object.assign({},o);o.max=o.max||o.maxWidth;o.sw=o.sw||o.strokeWidth;return text(s,x,y,o);};
  G.ui.button=function(o){if(o.ghost){G.ui.hit(o);return;}button(o);};

  G.prompt=function(title,value,done){
    var overlay=document.getElementById('family-name-dialog'),input=document.getElementById('family-name-input');
    overlay.classList.add('open');input.value=value||'';
    var previous=document.activeElement;
    function finish(v){overlay.classList.remove('open');done(v);if(previous&&previous.focus)previous.focus();}
    document.getElementById('family-name-ok').onclick=function(){var v=input.value.trim();if(v)finish(v);else input.focus();};
    document.getElementById('family-name-cancel').onclick=function(){finish(null);};

/* ===== 92-family-account.js ===== */
/* Accounts: who is playing. Each child gets their own dino, their own save and
   an optional 3-icon "secret" instead of a password — a 3-year-old cannot type
   but can absolutely remember "cuore, stella, luna".
   This is a family lock, not security: it keeps two siblings out of each
   other's progress, nothing more. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;

  var COLORS = [C.dino, C.blueberry, C.pinkPop, C.tangerine, C.plum, C.water];

  var SECRET_KEYS = [
    { shape: 'cerchio', color: C.berry, name: 'cerchio rosso' },
    { shape: 'quadrato', color: C.blueberry, name: 'quadrato blu' },
    { shape: 'triangolo', color: C.mint, name: 'triangolo verde' },
    { shape: 'cuore', color: C.pinkPop, name: 'cuore rosa' },
    { shape: 'stella', color: C.sun, name: 'stella gialla' },
    { shape: 'fiore', color: C.plum, name: 'fiore viola' },
    { shape: 'luna', color: C.tangerine, name: 'luna arancione' },
    { shape: 'rombo', color: C.water, name: 'rombo azzurro' },
    { shape: 'quadrato', color: C.leafLight, name: 'quadrato verde' }
  ];

  function secretIcon(c, x, y, r, i) {
    var legacy=G.current==='segreto' && sg && G.accounts.byId(sg.id);
    if(legacy && legacy.secretVersion!==2){
      if(i===6){c.save();c.strokeStyle=C.sun;c.fillStyle=C.sun;c.lineWidth=4;c.beginPath();c.arc(x,y,r*.5,0,7);c.fill();for(var ray=0;ray<8;ray++){var ang=ray*Math.PI/4;c.beginPath();c.moveTo(x+Math.cos(ang)*r*.7,y+Math.sin(ang)*r*.7);c.lineTo(x+Math.cos(ang)*r,y+Math.sin(ang)*r);c.stroke();}c.restore();return;}
      i=[3,4,6,0,7,5,4,2,1][i];
    }
    var k = SECRET_KEYS[i % SECRET_KEYS.length];
    var f = window.A && A.SHAPES && A.SHAPES[k.shape];
    if (f) { f(c, x, y, r, k.color); return; }
    c.save(); c.fillStyle = k.color; c.strokeStyle = C.ink; c.lineWidth = 4;

  /* `gear` is a look object from G.look (see 01c-art-gear.js). Pass one when
     drawing SOMEBODY ELSE'S dino; pass nothing for the current player and
     A.dino resolves the current save itself.
     Every account gets its OWN buffer — this screen draws up to five dinos in
     a single frame, and a shared one would put the last child's hat on all of
     them. To a three-year-old that is not a glitch, that is a theft. */

      if (gear) o.gear = gear;

    c.save();
    c.fillStyle = 'rgba(10,32,20,.34)';
    c.fillRect(0, 0, W, H);
    c.restore();
    if (title) G.text(title, W / 2, 78, { size: 60, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 12 });
    if (window.A && A.canopy) A.canopy(c, G.t);

  /* ------------------------------------------------------- scene: accesso */
  var accountPage = 0;
  var lookCache = {};     // account id -> its OWN look buffer, read once per entry

  G.scene('accesso', {
    hud: false, back: false,
    enter: function () {
      lookCache = {};

      G.text('giocatore', xn + cw / 2, y + wn + ch - 54, { size: 30, color: '#fff', stroke: 'rgba(0,0,0,.25)' });

      // discreet parent door
      G.ui.round({
        id: 'gear-login', x: W - 56, y: H - 52, r: 30, color: 'rgba(255,246,224,.55)',
        icon: function (cc, x, yy, r) {
          cc.save(); cc.fillStyle = C.ink;

    },

      backdrop(c, null);
      var titles = ['', 'Scegli il colore', 'Quanti anni hai?', 'Scegli il tuo segreto'];
      G.text(titles[nu.step] || '', W / 2, 74, { size: 52, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 11 });

      if (nu.step === 1) {
        dinoPreview(c, W / 2, 430, 240, nu.color);
        G.text(nu.name, W / 2, 470, { size: 40, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 9 });
        var bw = 128, bg = 18, tot = COLORS.length * bw + (COLORS.length - 1) * bg, x0 = (W - tot) / 2;
        COLORS.forEach(function (col, i) {
          G.ui.button({
            id: 'col' + i, x: x0 + i * (bw + bg), y: 150, w: bw, h: 116, r: 24, color: col,
            icon: function (cc, cx, cy) {
              if (nu.color === col) {
                cc.save(); cc.strokeStyle = '#fff'; cc.lineWidth = 8; cc.lineCap = 'round'; cc.lineJoin = 'round';
                cc.beginPath(); cc.moveTo(cx - 22, cy); cc.lineTo(cx - 6, cy + 18); cc.lineTo(cx + 24, cy - 18); cc.stroke(); cc.restore();
              }
            },
            onTap: function () { nu.color = col; G.sfx('pop'); }
          });
        });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 2; G.say('Quanti anni hai?'); } });
      }

      if (nu.step === 2) {
        [{ lv: 1, t: 'Piccolo', s: '3 - 4 anni', col: C.tangerine }, { lv: 2, t: 'Grande', s: '5 - 7 anni', col: C.blueberry }]
          .forEach(function (o, i) {
            var x = W / 2 - 340 + i * 360;
            G.ui.button({
              id: 'lv' + o.lv, x: x, y: 180, w: 320, h: 300, r: 30,
              color: nu.level === o.lv ? o.col : G.shade(o.col, 40),
              label: o.t, sub: o.s, fontSize: 52,
              onTap: function () { nu.level = o.lv; G.sfx('pop'); }
            });
          });
        G.text(nu.level === 1 ? 'Giochi piu semplici, tutto raccontato a voce'
          : 'Somme, sottrazioni e griglie piu grandi',
          W / 2, 528, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 3; G.say('Scegli tre figure: sara il tuo segreto.'); } });
      }

      if (nu.step === 3) {
        G.text('Tocca 3 figure e ricordale bene', W / 2, 132, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        var i;
        for (i = 0; i < 3; i++) {
          var sx = W / 2 + (i - 1) * 90, sy = 196;
          c.save(); c.fillStyle = 'rgba(255,246,224,.32)';
          c.beginPath(); c.arc(sx, sy, 32, 0, 7); c.fill(); c.restore();
          if (nu.secret[i] !== undefined) secretIcon(c, sx, sy, 25, nu.secret[i]);
        }
        var px = W / 2 - 236, py = 254, cell = 140, gap = 16;
        for (i = 0; i < 9; i++) {
          (function (idx) {
            var bx = px + (idx % 3) * (cell + gap), by = py + Math.floor(idx / 3) * (cell + gap);
            G.ui.button({
              id: 'nk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
              disabled: nu.secret.length >= 3,
              icon: function (cc, cx, cy) { secretIcon(cc, cx, cy, cell * .29, idx); },
              onTap: function () { nu.secret.push(idx); G.sfx('pop'); }
            });
          })(i);
        }
        G.ui.button({
          x: 40, y: H - 116, w: 260, h: 92, r: 26, color: C.bark, label: 'Rifai', fontSize: 34,
          onTap: function () { nu.secret = []; }
        });
        G.ui.button({
          x: W - 300, y: H - 116, w: 260, h: 92, r: 26, color: C.leafDark, label: 'Senza segreto', fontSize: 24,
          onTap: function () { nu.secret = []; finish(); }
        });
        if (nu.secret.length === 3) {
          G.ui.button({
            x: W / 2 - 170, y: H - 116, w: 340, h: 92, r: 26, color: C.leaf, label: 'Fatto!', onTap: finish
          });
        }
      }
    }
  });

  function finish() {
    var a = G.accounts.create({ name: nu.name, color: nu.color, level: nu.level, secret: nu.secret.length === 3 ? nu.secret : null });
    (G.familyLogin || G.accounts.login)(a.id);
    G.fx.confetti(); G.sfx('win');
    G.go('menu');
    setTimeout(function () { G.say('Buon divertimento, ' + a.name + '!'); }, 900);
  }

  /* ---------------------------------------------------------- scene: gate */
  var gt = { a: 0, b: 0, typed: '', then: null, arg: null, back: 'giungla', backArg: null, shake: 0 };

  G.scene('gate', {
    hud: false, back: false,
    enter: function (p) {
      p = p || {};
      gt.a = G.rndi(6, 9); gt.b = G.rndi(6, 9);
      gt.typed = ''; gt.shake = 0;
      gt.then = !p.then || p.then==='genitori' ? 'family-settings' : p.then; gt.arg = p.arg || null;
      gt.back = p.back || 'giungla'; gt.backArg = p.backArg || null;
    },
    update: function (dt) { if (gt.shake > 0) gt.shake = Math.max(0, gt.shake - dt * 4); },
    draw: function (c) {
      backdrop(c, null);
      c.save(); c.fillStyle = 'rgba(8,26,18,.5)'; c.fillRect(0, 0, W, H); c.restore();

      G.text('Solo per i grandi', W / 2, 96, { size: 50, color: C.cream, stroke: 'rgba(0,0,0,.5)', strokeWidth: 10 });

      var jitter = gt.shake > 0 ? Math.sin(G.t * 48) * gt.shake * 12 : 0;
      c.save();
      if (window.A && A.panel) A.panel(c, 150 + jitter, 176, 460, 300, { r: 28 });
      else { c.fillStyle = C.cream; G.roundRect(c, 150 + jitter, 176, 460, 300, 28); c.fill(); }
      c.restore();
      G.text(gt.a + ' × ' + gt.b + ' = ?', 380 + jitter, 268, { size: 72, color: C.ink });
      c.save();
      c.fillStyle = '#fffdf6'; c.strokeStyle = '#cdb389'; c.lineWidth = 5;
      G.roundRect(c, 220 + jitter, 336, 320, 96, 20); c.fill(); c.stroke();
      c.restore();
      G.text(gt.typed || '–', 380 + jitter, 386, { size: 58, color: C.ink });

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
      var kx = 700, ky = 168, kw = 150, kh = 116, kg = 14;
      keys.forEach(function (k, i) {
        var x = kx + (i % 3) * (kw + kg), y = ky + Math.floor(i / 3) * (kh + kg);
        G.ui.button({
          id: 'g' + k, x: x, y: y, w: kw, h: kh, r: 22,
          color: k === 'OK' ? C.leaf : k === 'C' ? C.berry : C.cream,
          textColor: (k === 'OK' || k === 'C') ? '#fff' : C.ink,
          outline: (k === 'OK' || k === 'C') ? 'rgba(0,0,0,.2)' : 'rgba(0,0,0,0)',
          label: k, fontSize: 44,
          onTap: function () {
            if (k === 'C') { gt.typed = ''; return; }
            if (k === 'OK') {
              if (parseInt(gt.typed, 10) === gt.a * gt.b) {
                G.sfx('good');
                if (gt.then === '@login') { (G.familyLogin || G.accounts.login)(gt.arg); G.go('menu'); }
                else G.go(gt.then, gt.arg);
              } else { gt.shake = 1; gt.typed = ''; G.sfx('bad'); }
              return;
            }
            if (gt.typed.length < 3) gt.typed += k;
          }
        });
      });

      G.ui.button({
        x: 150, y: H - 108, w: 300, h: 84, r: 24, color: C.bark, label: 'Annulla',
        onTap: function () { G.go(gt.back, gt.backArg); }
      });
    }
  });


  G.scene('genitori',{hud:false,enter:function(){G.go('gate',{then:'family-settings'});}});
  G.scene('family-settings', {hud:false,back:false,draw:function(c){
    backdrop(c,'Impostazioni');
    var a=G.account;
    if(a) {
      dinoPreview(c,340,470,230,a.color);
      G.text(a.name,340,510,{size:40,color:C.cream});
      G.ui.button({id:'family-age',x:650,y:190,w:460,h:100,color:C.water,label:G.level===1?'Piccolo · 3–4 anni':'Grande · 5–7 anni',onTap:function(){G.level=G.level===1?2:1;G.accounts.update(a.id,{level:G.level});G.saveNow();}});
      G.ui.button({id:'family-color',x:650,y:315,w:460,h:100,color:C.tangerine,label:'Cambia colore',onTap:function(){G.accounts.update(a.id,{color:COLORS[(COLORS.indexOf(a.color)+1)%COLORS.length]});}});
    }
    G.ui.button({id:'family-switch',x:650,y:440,w:460,h:100,color:C.blueberry,label:'Cambia giocatore',onTap:function(){G.accounts.logout();G.go('accesso');}});
    G.ui.button({id:'family-back',x:650,y:565,w:460,h:100,color:C.leaf,label:'Torna al gioco',onTap:function(){G.go(G.account?'menu':'accesso');}});
  }});
})();

(function(){'use strict';
  var asked=false;addEventListener('pointerdown',function(){if(asked)return;asked=true;try{if(matchMedia('(pointer: coarse)').matches&&!document.fullscreenElement)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(function(){});}catch(e){}},{passive:true});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});});
  G.start('accesso');
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
