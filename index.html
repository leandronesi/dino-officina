<script>
/* ===== 00-core.js ===== */
/* Dino Officina — piccolo motore canvas, senza dipendenze. */
(function () {
  'use strict';
  var W = 1280, H = 720, TAU = Math.PI * 2;
  var G = window.G = { W:W, H:H, TAU:TAU, t:0, dt:0, frame:0 };
  G.C = { navy:'#163c45', navy2:'#0f2b33', steel:'#6e8790', steel2:'#435b63', cream:'#fff5dc', ink:'#26343a', sun:'#ffcb4c', orange:'#ef8b45', red:'#ef735d', green:'#48b878', blue:'#4e9ed6', plum:'#9b6dcc', pink:'#ef78a8', floor:'#d5b98c', shadow:'rgba(20,25,25,.24)' };
  G.clamp = function (v,a,b) { return Math.max(a,Math.min(b,v)); };
  G.lerp = function (a,b,t) { return a+(b-a)*t; };
  G.pick = function (a) { return a[Math.floor(Math.random()*a.length)]; };
  G.rndi = function (a,b) { return Math.floor(a+Math.random()*(b-a+1)); };
  G.shuffle = function (a) { a=a.slice(); for(var i=a.length-1;i;i--){var j=Math.floor(Math.random()*(i+1)),q=a[i];a[i]=a[j];a[j]=q;} return a; };
  G.dist = function (a,b,c,d) { return Math.hypot(a-c,b-d); };

  var cv=document.getElementById('c'), c=G.ctx=cv.getContext('2d',{alpha:false}), view=G.view={s:1,ox:0,oy:0,dpr:1};
  function resize(){ var cw=innerWidth,ch=innerHeight,dpr=Math.min(devicePixelRatio||1,2.5); view.s=Math.min(cw/W,ch/H); view.ox=(cw-W*view.s)/2; view.oy=(ch-H*view.s)/2; view.dpr=dpr; cv.width=Math.max(1,Math.round(cw*dpr)); cv.height=Math.max(1,Math.round(ch*dpr)); cv.style.width=cw+'px';cv.style.height=ch+'px'; var r=document.getElementById('rot'); if(r)r.classList.toggle('on',ch>cw*1.08); }
  addEventListener('resize',resize); addEventListener('orientationchange',function(){setTimeout(resize,120);}); resize();
  G.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
  G.panel=function(x,y,w,h,color,r){c.save();c.shadowColor=G.C.shadow;c.shadowBlur=18;c.shadowOffsetY=8;G.roundRect(x,y,w,h,r||28);c.fillStyle=color||G.C.cream;c.fill();c.shadowColor='transparent';c.restore();};
  G.text=function(s,x,y,o){o=o||{};c.save();c.font=(o.weight||900)+' '+(o.size||32)+'px "Trebuchet MS","Segoe UI",sans-serif';c.textAlign=o.align||'center';c.textBaseline=o.base||'middle';if(o.stroke){c.lineJoin='round';c.lineWidth=o.sw||8;c.strokeStyle=o.stroke;c.strokeText(String(s),x,y,o.max);}c.fillStyle=o.color||G.C.ink;c.fillText(String(s),x,y,o.max);c.restore();};
  G.shade=function(hex,n){var v=parseInt(hex.slice(1),16),r=G.clamp((v>>16)+n,0,255),g=G.clamp(((v>>8)&255)+n,0,255),b=G.clamp((v&255)+n,0,255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};

  var AC=null;
  G.sfx=function(name){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!AC)AC=new C();var notes=name==='win'?[523,659,784,1046]:name==='bad'?[240,190]:name==='snap'?[620,900]:[500];notes.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.08;o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.16);});}catch(e){}};
  G.say=function(s){try{if(!speechSynthesis||!s)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='it-IT';u.rate=.92;u.pitch=1.12;speechSynthesis.speak(u);}catch(e){}};

  var LEGACY_KEY='dino-officina.save', PROFILES_KEY='dino-officina.profiles', legacy, profiles=[];
  try{legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');}catch(e){}
  try{profiles=JSON.parse(localStorage.getItem(PROFILES_KEY)||'[]');}catch(e){}
  if(!Array.isArray(profiles))profiles=[];
  if(!profiles.length&&legacy&&typeof legacy==='object'&&!Array.isArray(legacy)){profiles=[{id:'legacy',name:'Dino',color:G.C.green,level:legacy.level===2?2:1,secret:null,created:Date.now()}];try{localStorage.setItem(PROFILES_KEY,JSON.stringify(profiles));localStorage.setItem(LEGACY_KEY+'.legacy',JSON.stringify(legacy));}catch(e){}}
  function blank(){return{level:1,stars:0,done:{},freeBuilds:0,mute:false};}
  function clean(s){var b=blank(),k;if(!s||typeof s!=='object'||Array.isArray(s))return b;for(k in b)if(s[k]===undefined||s[k]===null)s[k]=b[k];if(typeof s.done!=='object'||Array.isArray(s.done))s.done={};if(typeof s.stars!=='number'||!isFinite(s.stars)||s.stars<0)s.stars=0;s.stars=Math.floor(s.stars);return s;}
  function readProfile(id){var p=profiles.filter(function(q){return q.id===id;})[0],s=null;if(p&&p.id==='legacy')s=legacy||null;try{s=s||JSON.parse(localStorage.getItem(LEGACY_KEY+'.'+id)||'null');}catch(e){}return clean(s);}
  G._profiles=profiles; G._activeId=null; G.account=null; G.save=clean(legacy); G.level=G.save.level===2?2:1;
  G._profileLogin=function(id){var p=profiles.filter(function(q){return q.id===id;})[0];if(!p)return false;G._activeId=p.id;G.account=p;G.save=readProfile(p.id);G.level=p.level===2?2:1;G.save.level=G.level;try{localStorage.setItem(LEGACY_KEY+'.'+p.id,JSON.stringify(G.save));localStorage.setItem('dino-officina.last',p.id);}catch(e){}return true;};
  G._profileLogout=function(){G.saveNow();G._activeId=null;G.account=null;G.save=blank();G.level=1;};
  G.saveNow=function(){G.save.level=G.level;if(G.account)G.account.level=G.level;try{localStorage.setItem(LEGACY_KEY+(G._activeId?'.'+G._activeId:''),JSON.stringify(G.save));if(G._activeId)localStorage.setItem(PROFILES_KEY,JSON.stringify(profiles));}catch(e){}};
  G._blankSave=blank; G._profilesKey=PROFILES_KEY;

  var hot=[],next=[],pressed=null,pointer={x:0,y:0,down:false};G.pointer=pointer;G.ui={};
  function logical(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.ox)/view.s,y:(e.clientY-r.top-view.oy)/view.s};}
  cv.addEventListener('pointerdown',function(e){var p=logical(e);pointer.x=p.x;pointer.y=p.y;pointer.down=true;for(var i=hot.length-1;i>=0;i--){var b=hot[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h&&!b.disabled){pressed=b.id;if(b.onDown)b.onDown(p);break;}}if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(q){}e.preventDefault();});
  cv.addEventListener('pointermove',function(e){var p=logical(e);pointer.x=p.x;pointer.y=p.y;if(pointer.down&&G.dragMove)G.dragMove(p);e.preventDefault();});
  cv.addEventListener('pointerup',function(e){var p=logical(e);pointer.x=p.x;pointer.y=p.y;pointer.down=false;if(G.dragEnd){var fn=G.dragEnd;G.dragEnd=null;G.dragMove=null;fn(p);}else for(var i=hot.length-1;i>=0;i--){var b=hot[i];if(b.id===pressed&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h&&!b.disabled){if(b.onTap)b.onTap();break;}}pressed=null;e.preventDefault();});
  G.ui.button=function(o){o.id=o.id||o.label+'@'+o.x+','+o.y;next.push(o);c.save();var down=pressed===o.id&&pointer.down;c.translate(0,down?4:0);c.globalAlpha=o.disabled ? .45 : 1;G.roundRect(o.x,o.y,o.w,o.h,o.r||22);c.fillStyle=o.color||G.C.green;c.fill();c.lineWidth=o.border||4;c.strokeStyle=o.stroke||'rgba(38,52,58,.55)';c.stroke();if(o.icon)o.icon(c,o.x+o.w/2,o.y+o.h/2-(o.label?12:0));if(o.label)G.text(o.label,o.x+o.w/2,o.y+o.h/2+(o.sub? -10:0),{size:o.fontSize||30,color:o.textColor||G.C.cream,max:o.w-20});if(o.sub)G.text(o.sub,o.x+o.w/2,o.y+o.h/2+27,{size:o.subSize||18,color:o.textColor||G.C.cream,weight:750,max:o.w-16});c.restore();};
  G.ui.hit=function(o){o.id=o.id||'hit'+o.x+','+o.y;next.push(o);};

  var scenes={},cur=null;G.current='';
  G.scene=function(name,o){scenes[name]=o;};
  G.go=function(name,arg){if(cur&&cur.leave)cur.leave();G.current=name;cur=scenes[name];hot=[];next=[];G.dragMove=null;G.dragEnd=null;if(!cur)throw new Error('scena mancante: '+name);if(cur.enter)cur.enter(arg);};
  G.start=function(name){G.go(name);requestAnimationFrame(loop);};
  function loop(ms){var now=ms/1000||0;G.dt=G.t?Math.min(.05,now-G.t):1/60;G.t=now;G.frame++;next=[];c.setTransform(view.dpr,0,0,view.dpr,0,0);c.clearRect(0,0,cv.width,cv.height);c.translate(view.ox,view.oy);c.scale(view.s,view.s);if(cur&&cur.update)cur.update(G.dt);if(cur&&cur.draw)cur.draw(c);hot=next;requestAnimationFrame(loop);}
  G.workshopBg=function(){var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4d9eaa');g.addColorStop(.58,'#b9e2df');g.addColorStop(.59,'#c8a879');g.addColorStop(1,'#8e6f4e');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='rgba(255,255,255,.16)';for(var x=35;x<W;x+=95){c.fillRect(x,80,8,260);}c.fillStyle='#7a5539';c.fillRect(0,548,W,18);};
})();


/* ===== 01-art.js ===== */
/* Pezzi e macchine: forme originali disegnate a canvas. */
(function(){'use strict';var c=G.ctx,C=G.C,T=G.TAU;
  function bolt(x,y,r){c.fillStyle=C.cream;c.beginPath();c.arc(x,y,r,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=Math.max(2,r*.3);c.stroke();c.beginPath();c.moveTo(x-r*.55,y);c.lineTo(x+r*.55,y);c.stroke();}
  G.drawPiece=function(type,x,y,scale,color,alpha,rot){scale=scale||1;color=color||C.red;c.save();c.translate(x,y);c.rotate(rot||0);c.globalAlpha=alpha===undefined?1:alpha;c.lineJoin='round';c.lineCap='round';c.strokeStyle=C.ink;c.lineWidth=5*scale;c.fillStyle=color;
    if(type==='beam'){G.roundRect(-62*scale,-19*scale,124*scale,38*scale,13*scale);c.fill();c.stroke();[-42,0,42].forEach(function(q){bolt(q*scale,0,7*scale);});}
    if(type==='wheel'){c.fillStyle=C.ink;c.beginPath();c.arc(0,0,43*scale,0,T);c.fill();c.fillStyle=color;c.beginPath();c.arc(0,0,27*scale,0,T);c.fill();c.stroke();bolt(0,0,8*scale);}
    if(type==='block'){G.roundRect(-43*scale,-34*scale,86*scale,68*scale,12*scale);c.fill();c.stroke();[-22,22].forEach(function(q){bolt(q*scale,0,7*scale);});}
    if(type==='cab'){G.roundRect(-50*scale,-35*scale,100*scale,70*scale,13*scale);c.fill();c.stroke();c.fillStyle='#aee6ef';G.roundRect(-28*scale,-23*scale,56*scale,34*scale,7*scale);c.fill();c.stroke();}
    if(type==='arm'){G.roundRect(-18*scale,-70*scale,36*scale,140*scale,12*scale);c.fill();c.stroke();[-48,0,48].forEach(function(q){bolt(0,q*scale,7*scale);});}
    if(type==='hook'){c.strokeStyle=color;c.lineWidth=20*scale;c.beginPath();c.moveTo(0,-45*scale);c.lineTo(0,20*scale);c.arc(22*scale,20*scale,22*scale,Math.PI,0);c.stroke();c.strokeStyle=C.ink;c.lineWidth=5*scale;c.stroke();}
    if(type==='prop'){c.fillStyle=color;for(var i=0;i<3;i++){c.rotate(T/3);c.beginPath();c.ellipse(0,-33*scale,14*scale,36*scale,0,0,T);c.fill();c.stroke();}bolt(0,0,9*scale);}
    if(type==='seat'){G.roundRect(-48*scale,-26*scale,96*scale,52*scale,14*scale);c.fill();c.stroke();c.fillStyle=G.shade(color,-25);G.roundRect(-41*scale,-65*scale,34*scale,55*scale,10*scale);c.fill();c.stroke();}
    c.restore();
  };
  G.drawDino=function(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=C.green;c.strokeStyle=C.ink;c.lineWidth=6;c.beginPath();c.ellipse(0,0,62,54,0,0,T);c.fill();c.stroke();c.beginPath();c.arc(42,-57,45,0,T);c.fill();c.stroke();c.fillStyle=C.cream;c.beginPath();c.ellipse(57,-45,28,18,0,0,T);c.fill();c.stroke();c.fillStyle=C.ink;c.beginPath();c.arc(52,-70,6,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=8;c.beginPath();c.moveTo(-34,40);c.lineTo(-38,78);c.moveTo(32,40);c.lineTo(38,78);c.stroke();c.restore();};
})();


/* ===== 05-menu.js ===== */
/* Il tavolo delle commesse e la scelta Piccolo / Grande. */
(function(){'use strict';var c=G.ctx,C=G.C,W=G.W,H=G.H;
  var cards=[
    {id:'libera',name:'Costruisci tu!',sub:'Pezzi liberi · nessun errore',color:C.plum,icon:'prop'},
    {id:'monopattino',name:'Il Dino-mobile',sub:'4 pezzi · ruote e sedile',color:C.green,icon:'wheel'},
    {id:'gru',name:'La Gru Gialla',sub:'5 pezzi · alza la cassa',color:C.sun,icon:'hook'},
    {id:'vento',name:'La Macchina del Vento',sub:'5 pezzi · gira l’elica',color:C.blue,icon:'prop'}
  ];
  G.scene('menu',{enter:function(){setTimeout(function(){if(G.current==='menu')G.say('Che cosa montiamo oggi?');},250);},draw:function(){
    G.workshopBg();c.fillStyle='rgba(15,43,51,.88)';c.fillRect(0,0,W,116);
    G.text('DINO OFFICINA',W/2,58,{size:54,color:C.sun,stroke:C.ink,sw:10});
    G.drawDino(1110,113,.62);G.text('★ '+G.save.stars,1180,52,{size:32,color:C.sun});
    G.ui.button({id:'small',x:28,y:24,w:190,h:70,r:22,color:G.level===1?C.green:C.steel2,label:'Piccolo',fontSize:27,onTap:function(){G.level=1;G.saveNow();G.sfx('snap');}});
    G.ui.button({id:'big',x:228,y:24,w:190,h:70,r:22,color:G.level===2?C.red:C.steel2,label:'Grande',fontSize:27,onTap:function(){G.level=2;G.saveNow();G.sfx('snap');}});
    G.ui.button({id:'profile',x:980,y:24,w:270,h:70,r:22,color:C.steel2,label:(G.account&&G.account.name)||'Profilo',fontSize:24,onTap:function(){G.go('genitori');}});
    var gap=20,w=285,x0=(W-(w*4+gap*3))/2;
    cards.forEach(function(o,i){var x=x0+i*(w+gap),done=G.save.done[o.id];G.panel(x,164,w,425,C.cream,28);c.fillStyle=o.color;G.roundRect(x+18,182,w-36,190,22);c.fill();G.drawPiece(o.icon,x+w/2,275,1.15,o.id==='gru'?C.orange:C.red);G.text(o.name,x+w/2,413,{size:29,color:C.ink,max:w-32});G.text(o.sub,x+w/2,461,{size:19,color:C.steel2,weight:750,max:w-30});if(done)G.text('★ FATTA!',x+w/2,506,{size:23,color:C.orange});
      G.ui.button({id:'job-'+o.id,x:x+32,y:530,w:w-64,h:76,r:23,color:o.color,textColor:o.id==='gru'?C.ink:C.cream,label:o.id==='libera'?'APRI IL BANCO':'MONTIAMO!',fontSize:22,onTap:function(){G.go('officina',{id:o.id});}});
    });
  }});
})();


/* ===== 10-officina.js ===== */
/* Monto → provo → aggiusto. Trascina oppure tocca un pezzo per agganciarlo. */
(function(){'use strict';var c=G.ctx,C=G.C,W=G.W,H=G.H;
  var COLORS=[C.red,C.blue,C.orange,C.green,C.plum,C.pink];
  var MISSIONS={
    monopattino:{name:'Il Dino-mobile',ask:'Monta due ruote, la pedana e il sedile.',slots:[['beam',520,355,0],['wheel',445,425,0],['wheel',595,425,0],['seat',535,292,0]],tray:['beam','wheel','wheel','seat']},
    gru:{name:'La Gru Gialla',ask:'Costruisci una gru che può alzare la cassa.',slots:[['block',505,408,0],['wheel',450,470,0],['wheel',560,470,0],['arm',505,285,0],['hook',600,205,-.7]],tray:['block','wheel','wheel','arm','hook']},
    vento:{name:'La Macchina del Vento',ask:'Metti ruote, cabina e una grande elica.',slots:[['beam',520,405,0],['wheel',445,470,0],['wheel',590,470,0],['cab',525,345,0],['prop',650,320,0]],tray:['beam','wheel','wheel','cab','prop']}
  };
  var S={};
  function freeMission(){var pts=[[360,280],[515,280],[670,280],[825,280],[360,425],[515,425],[670,425],[825,425]];return{name:'Costruzione libera',ask:'Inventa una macchina con almeno tre pezzi!',free:true,slots:pts.map(function(p){return['any',p[0],p[1],0];}),tray:['beam','wheel','block','cab','arm','hook','prop','seat']};}
  function reset(arg){var id=(arg&&arg.id)||'libera',m=id==='libera'?freeMission():MISSIONS[id];S={id:id,m:m,placed:new Array(m.slots.length).fill(null),drag:null,state:'build',testT:0,result:false,wrong:[],hint:-1,celebrate:0};var tray=m.tray.slice();if(G.level===2&&!m.free)tray.push(G.pick(['block','prop','cab']));S.pieces=tray.map(function(type,i){return{id:'p'+i,type:type,color:COLORS[i%COLORS.length],used:false};});G.say(m.ask);}
  function available(){return S.pieces.filter(function(p){return !p.used;});}
  function firstSlot(piece){for(var i=0;i<S.m.slots.length;i++)if(!S.placed[i]&&(S.m.free||S.m.slots[i][0]===piece.type))return i;return -1;}
  function install(piece,idx){if(idx<0)return false;if(S.placed[idx])S.placed[idx].used=false;piece.used=true;S.placed[idx]=piece;G.sfx('snap');S.hint=-1;return true;}
  function startDrag(piece,from,p){S.drag={piece:piece,from:from,x:p.x,y:p.y,sx:p.x,sy:p.y};if(from>=0)S.placed[from]=null;piece.used=false;G.dragMove=function(q){S.drag.x=q.x;S.drag.y=q.y;};G.dragEnd=function(q){var best=-1,bd=105;for(var i=0;i<S.m.slots.length;i++){if(S.placed[i])continue;var sl=S.m.slots[i],d=G.dist(q.x,q.y,sl[1],sl[2]);if(d<bd){if(G.level===1&&!S.m.free&&sl[0]!==piece.type)continue;best=i;bd=d;}}if(best<0&&G.dist(q.x,q.y,S.drag.sx,S.drag.sy)<22)best=firstSlot(piece);if(!install(piece,best)){if(from>=0)install(piece,from);else G.sfx('bad');}S.drag=null;};}
  function completeCount(){return S.placed.filter(Boolean).length;}
  function verify(){S.wrong=[];if(S.m.free)return completeCount()>=3;for(var i=0;i<S.m.slots.length;i++)if(!S.placed[i]||S.placed[i].type!==S.m.slots[i][0])S.wrong.push(i);return !S.wrong.length;}
  function test(){S.result=verify();S.state='testing';S.testT=0;G.say(S.result?'Proviamo! Funziona?':'Proviamo... qualcosa non va.');}
  function finishTest(){if(S.result){S.state='win';S.celebrate=0;if(!G.save.done[S.id])G.save.stars++;G.save.done[S.id]=true;if(S.id==='libera')G.save.freeBuilds++;G.saveNow();G.sfx('win');G.say('Funziona! Che invenzione!');}else{S.state='adjust';G.sfx('bad');G.say('Aggiustiamo i pezzi che lampeggiano.');}}
  function drawSlot(sl,i){var pulse=.62+.2*Math.sin(G.t*5+i),bad=S.state==='adjust'&&S.wrong.indexOf(i)>=0;c.save();c.globalAlpha=bad ? .42 : pulse;c.setLineDash([12,9]);c.strokeStyle=bad?C.red:(S.hint===i?C.sun:C.steel2);c.lineWidth=bad?10:6;c.beginPath();c.arc(sl[1],sl[2],58,0,G.TAU);c.stroke();c.setLineDash([]);if(!S.m.free)G.drawPiece(sl[0],sl[1],sl[2],.72,'#8aa1a8',.26,sl[3]);c.restore();}
  function drawMachine(offset){offset=offset||0;for(var i=0;i<S.m.slots.length;i++){var sl=S.m.slots[i],p=S.placed[i];if(!p)drawSlot(sl,i);else G.drawPiece(p.type,sl[1]+offset,sl[2]+(S.state==='testing'&&!S.result?Math.sin(G.t*23+i)*7:0),.88,p.color,1,sl[3]);}}
  function tray(){var list=available(),n=list.length,w=104,g=13,total=n*w+(n-1)*g,x=(W-total)/2;list.forEach(function(p,i){var bx=x+i*(w+g);G.ui.button({id:'tray-'+p.id,x:bx,y:588,w:w,h:104,r:20,color:C.cream,icon:function(){G.drawPiece(p.type,bx+w/2,640,.62,p.color);},onDown:function(q){startDrag(p,-1,q);}});});if(!list.length)G.text('Tutti i pezzi sono sul banco!',W/2,644,{size:25,color:C.cream});}
  function placedHits(){S.placed.forEach(function(p,i){if(!p)return;var sl=S.m.slots[i];G.ui.hit({id:'placed-'+i,x:sl[1]-62,y:sl[2]-62,w:124,h:124,onDown:function(q){if(S.state==='build'||S.state==='adjust')startDrag(p,i,q);}});});}
  G.scene('officina',{enter:reset,update:function(dt){if(S.state==='testing'){S.testT+=dt;if(S.testT>2.25)finishTest();}if(S.state==='win')S.celebrate+=dt;},draw:function(){
    G.workshopBg();c.fillStyle='rgba(15,43,51,.9)';c.fillRect(0,0,W,102);G.text(S.m.name,W/2,49,{size:42,color:C.sun,stroke:C.ink,sw:8});
    G.ui.button({id:'back',x:22,y:18,w:150,h:66,r:20,color:C.steel2,label:'← MENU',fontSize:22,onTap:function(){G.go('menu');}});
    if(S.state==='build'||S.state==='adjust'){G.ui.button({id:'help',x:1090,y:18,w:165,h:66,r:20,color:C.orange,textColor:C.ink,label:'AIUTO',fontSize:23,onTap:function(){var arr=[];for(var i=0;i<S.m.slots.length;i++)if(!S.placed[i])arr.push(i);S.hint=arr.length?arr[0]:0;G.say('Metti qui il prossimo pezzo.');}});}
    G.panel(245,126,690,402,'rgba(255,245,220,.93)',32);c.fillStyle='#9a7854';c.fillRect(270,500,640,25);c.fillStyle='#694b34';c.fillRect(310,525,34,63);c.fillRect(840,525,34,63);
    var off=S.state==='testing'&&S.result?Math.sin(S.testT*7)*18:0;drawMachine(off);placedHits();
    if(S.state==='build'||S.state==='adjust'){tray();var ready=S.m.free?completeCount()>=3:completeCount()===S.m.slots.length;G.ui.button({id:'test',x:970,y:345,w:250,h:122,r:30,color:ready?C.green:C.steel,label:'PROVA!',sub:ready?'Vediamo se va':'Mancano pezzi',fontSize:39,disabled:!ready,onTap:test});G.text(S.state==='adjust'?'AGGIUSTA I PEZZI ROSSI':S.m.ask,590,554,{size:23,color:S.state==='adjust'?C.red:C.cream,stroke:C.ink,sw:5,max:650});}
    if(S.state==='testing'){G.text(S.result?'BRUM... PROVIAMO!':'TAC... TOC...',1080,250,{size:29,color:S.result?C.green:C.red,stroke:C.cream,sw:5});}
    if(S.state==='win'){c.fillStyle='rgba(15,43,51,.78)';c.fillRect(0,0,W,H);G.text('FUNZIONA!',W/2,205,{size:86,color:C.sun,stroke:C.ink,sw:14});G.text('★',W/2,330,{size:112,color:C.sun,stroke:C.orange,sw:8});G.ui.button({id:'again',x:300,y:465,w:300,h:105,r:28,color:C.blue,label:'ANCORA!',fontSize:34,onTap:function(){reset({id:S.id});}});G.ui.button({id:'done',x:680,y:465,w:300,h:105,r:28,color:C.green,label:'ALTRO LAVORO',fontSize:28,onTap:function(){G.go('menu');}});}
    if(S.drag)G.drawPiece(S.drag.piece.type,S.drag.x,S.drag.y,1,S.drag.piece.color,.9);
  }});
  G.officinaState=function(){return{id:S.id,state:S.state,count:completeCount(),wrong:S.wrong.slice(),stars:G.save.stars};};
  G.officinaAutoBuild=function(wrong){S.pieces.forEach(function(p){p.used=false;});S.placed.fill(null);for(var i=0;i<S.m.slots.length;i++){var want=S.m.slots[i][0],p=null;if(wrong&&i===0)p=S.pieces.filter(function(q){return !q.used&&q.type!==want;})[0];if(!p)p=S.pieces.filter(function(q){return !q.used&&(S.m.free||q.type===want);})[0];if(p)install(p,i);}return completeCount();};
  G.officinaTest=test;
})();


/* ===== 90-account.js ===== */
/* Dino Officina — profili locali. The profile gate is small on purpose: it
   keeps siblings' progress separate without adding libraries or a server. */
(function () {
  'use strict';
  var C = G.C, W = G.W, H = G.H;
  var list = G._profiles || [], pending = null;
  var draft = { name: 'Dino', color: C.green, level: 1, secret: [] };
  var secretShapes = ['cuore', 'stella', 'luna'];
  var gate = { hold: 0, unlocked: false };

  function persist() { try { localStorage.setItem(G._profilesKey, JSON.stringify(list)); } catch (e) {} }
  function idFor() { return 'p-' + Date.now().toString(36) + '-' + G.rndi(100, 999); }
  function nameFor() { try { if (typeof prompt === 'function') return String(prompt('Come si chiama il dino?', draft.name) || draft.name).slice(0, 18) || 'Dino'; } catch (e) {} return draft.name; }
  function profile(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  G.accounts = {
    list: function () { return list.slice(); },
    create: function (o) {
      o = o || {}; var p = { id: o.id || idFor(), name: String(o.name || 'Dino').slice(0, 18), color: o.color || C.green, level: o.level === 2 ? 2 : 1, secret: Array.isArray(o.secret) ? o.secret.slice(0, 3) : [], created: Date.now() };
      list.push(p); persist();
      try { localStorage.setItem('dino-officina.save.' + p.id, JSON.stringify(G._blankSave())); } catch (e) {}
      return p;
    },
    update: function (id, patch) { var p = profile(id); if (!p) return null; patch = patch || {}; if (patch.name) p.name = String(patch.name).slice(0, 18); if (patch.color) p.color = patch.color; if (patch.level === 1 || patch.level === 2) p.level = patch.level; if (Array.isArray(patch.secret)) p.secret = patch.secret.slice(0, 3); persist(); if (G.account && G.account.id === id) { G.account = p; G.level = p.level; G.save.level = G.level; G.saveNow(); } return p; },
    remove: function (id) { var p = profile(id); if (!p) return false; list.splice(list.indexOf(p), 1); persist(); try { localStorage.removeItem('dino-officina.save.' + id); } catch (e) {} if (G.account && G.account.id === id) { G._profileLogout(); G.go('accesso'); } return true; },
    login: function (id) { var p = profile(id); if (!p) return false; if (p.secret && p.secret.length) { pending = p.id; G.go('segreto'); return true; } G._profileLogin(id); G.go('menu'); return true; },
    logout: function () { G._profileLogout(); G.go('accesso'); },
    last: function () { try { return localStorage.getItem('dino-officina.last'); } catch (e) { return null; } }
  };

  function icon(c, x, y, type, col) { c.save(); c.fillStyle = col || C.orange; c.strokeStyle = C.ink; c.lineWidth = 5; if (type === 'heart') { c.beginPath(); c.moveTo(x, y + 20); c.bezierCurveTo(x - 46, y - 10, x - 30, y - 42, x, y - 20); c.bezierCurveTo(x + 30, y - 42, x + 46, y - 10, x, y + 20); c.fill(); c.stroke(); } else if (type === 'star') { c.beginPath(); for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 17 : 37; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); c.fill(); c.stroke(); } else { c.beginPath(); c.arc(x, y, 36, 0, 7); c.fill(); c.stroke(); c.fillStyle = C.cream; c.beginPath(); c.arc(x + 12, y - 2, 30, 0, 7); c.fill(); c.restore(); } }
  function card(c, p, i, manage) { var x = 100 + i * 380; G.panel(x, 180, 340, 260, C.cream, 28); c.fillStyle = p.color; c.beginPath(); c.arc(x + 170, 260, 60, 0, 7); c.fill(); G.text(p.name, x + 170, 355, { size: 31, color: C.ink, max: 280 }); G.text(p.level === 2 ? 'Grande' : 'Piccolo', x + 170, 395, { size: 21, color: C.steel2 }); G.ui.button({ id: (manage ? 'use-' : 'login-') + p.id, x: x + 46, y: 465, w: 248, h: 88, r: 22, color: p.color, textColor: C.ink, label: manage ? 'SCEGLI' : 'GIOCA', fontSize: 27, onTap: function () { G.accounts.login(p.id); } }); }

  G.scene('accesso', { enter: function () { if (G.hush) G.hush(); }, draw: function (c) {
    G.workshopBg(); G.text('CHI GIOCA?', W / 2, 80, { size: 54, color: C.sun, stroke: C.ink, sw: 10 });
    if (!list.length) G.text('Crea il primo profilo', W / 2, 190, { size: 34, color: C.cream });
    list.slice(0, 3).forEach(function (p, i) { card(c, p, i, false); });
    G.ui.button({ id: 'new-profile', x: 460, y: 570, w: 360, h: 100, r: 26, color: C.green, label: 'NUOVO DINO', fontSize: 32, onTap: function () { G.go('nuovo'); } });
    if (list.length) G.ui.button({ id: 'manage-profile', x: 1010, y: 24, w: 240, h: 70, r: 20, color: C.steel2, label: 'GENITORI', fontSize: 23, onTap: function () { gate.hold = 0; gate.unlocked = false; G.go('genitori'); } });
  } });

  G.scene('nuovo', { enter: function () { draft = { name: 'Dino', color: C.green, level: 1, secret: [] }; }, draw: function (c) {
    G.workshopBg(); G.text('NUOVO DINO', W / 2, 74, { size: 50, color: C.sun, stroke: C.ink, sw: 9 });
    G.ui.button({ id: 'name', x: 180, y: 145, w: 420, h: 90, r: 22, color: C.cream, textColor: C.ink, label: draft.name, fontSize: 32, onTap: function () { draft.name = nameFor(); } });
    G.text('Scegli colore ed età', 850, 160, { size: 26, color: C.cream });
    [C.green, C.red, C.blue, C.orange].forEach(function (col, i) { G.ui.button({ id: 'col' + i, x: 660 + i * 125, y: 190, w: 100, h: 90, r: 22, color: col, label: '●', fontSize: 42, onTap: function () { draft.color = col; } }); });
    G.ui.button({ id: 'small', x: 650, y: 305, w: 260, h: 82, r: 22, color: draft.level === 1 ? C.green : C.steel2, label: 'PICCOLO', fontSize: 27, onTap: function () { draft.level = 1; } });
    G.ui.button({ id: 'big', x: 930, y: 305, w: 260, h: 82, r: 22, color: draft.level === 2 ? C.red : C.steel2, label: 'GRANDE', fontSize: 27, onTap: function () { draft.level = 2; } });
    G.text('Segreto facoltativo: tocca tre figure', W / 2, 420, { size: 25, color: C.cream });
    secretShapes.forEach(function (shape, i) { G.ui.button({ id: 'secret-' + i, x: 440 + i * 145, y: 450, w: 110, h: 90, r: 22, color: draft.secret.indexOf(i) >= 0 ? C.sun : C.steel2, label: shape === 'cuore' ? '♥' : shape === 'stella' ? '★' : '☾', textColor: C.ink, fontSize: 42, onTap: function () { if (draft.secret.length < 3 && draft.secret.indexOf(i) < 0) draft.secret.push(i); else if (draft.secret.indexOf(i) >= 0) draft.secret.splice(draft.secret.indexOf(i), 1); } }); });
    G.ui.button({ id: 'create-profile', x: 340, y: 590, w: 300, h: 92, r: 22, color: C.green, label: 'CREA', fontSize: 31, onTap: function () { var p = G.accounts.create(draft); G._profileLogin(p.id); G.go('menu'); } });
    G.ui.button({ id: 'cancel-profile', x: 680, y: 590, w: 300, h: 92, r: 22, color: C.steel2, label: 'INDIETRO', fontSize: 28, onTap: function () { G.go('accesso'); } });
  } });

  G.scene('segreto', { enter: function () { gate.hold = 0; }, draw: function (c) { G.workshopBg(); G.text('IL SEGRETO DEL DINO', W / 2, 100, { size: 43, color: C.sun, stroke: C.ink, sw: 9 }); G.text('Tocca le tre figure nell’ordine', W / 2, 170, { size: 28, color: C.cream }); secretShapes.forEach(function (shape, i) { G.ui.button({ id: 'check-' + i, x: 390 + i * 170, y: 275, w: 130, h: 130, r: 28, color: C.plum, label: shape === 'cuore' ? '♥' : shape === 'stella' ? '★' : '☾', fontSize: 56, onTap: function () { var p = profile(pending), want = p && p.secret ? p.secret : []; if (want[gate.hold] === i) { gate.hold++; if (gate.hold >= want.length) { var id = pending; pending = null; gate.hold = 0; G._profileLogin(id); G.go('menu'); } } else { gate.hold = 0; G.say('Riproviamo insieme.'); } } }); }); G.text(gate.hold ? 'Figure: ' + gate.hold + ' / 3' : 'Inizia dal primo simbolo', W / 2, 500, { size: 28, color: C.cream }); G.ui.button({ id: 'secret-back', x: 470, y: 590, w: 340, h: 90, r: 22, color: C.steel2, label: 'INDIETRO', fontSize: 28, onTap: function () { pending = null; G.go('accesso'); } }); } });

  G.scene('genitori', { update: function (dt) { if (!gate.unlocked && gate.hold > 0 && G.pointer.down) gate.hold = Math.max(0, gate.hold - dt); }, draw: function (c) {
    G.workshopBg(); G.text('AREA GENITORI', W / 2, 80, { size: 48, color: C.sun, stroke: C.ink, sw: 9 });
    if (!gate.unlocked) { G.text('Tieni premuto per entrare', W / 2, 220, { size: 34, color: C.cream }); G.ui.button({ id: 'unlock', x: 440, y: 300, w: 400, h: 140, r: 28, color: C.orange, label: gate.hold ? 'ANCORA…' : 'TIENI PREMUTO', fontSize: 30, onDown: function () { gate.hold = 1.6; }, onTap: function () { if (gate.hold <= 0) { gate.unlocked = true; G.sfx('snap'); } else G.say('Tieni ancora un pochino.'); } }); }
    else { G.text('Scegli il profilo e la difficoltà', W / 2, 145, { size: 28, color: C.cream }); list.slice(0, 3).forEach(function (p, i) { card(c, p, i, true); }); G.ui.button({ id: 'parents-back', x: 480, y: 610, w: 320, h: 78, r: 20, color: C.steel2, label: 'MENU', fontSize: 27, onTap: function () { G.go('menu'); } }); }
  } });
})();
