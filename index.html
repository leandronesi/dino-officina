<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Dino Officina — monta, prova e aggiusta buffe macchine.">
<meta name="theme-color" content="#163c45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Dino Officina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#102e35; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
#c { position:fixed; inset:0; display:block; touch-action:none; }
#rot { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#163c45; color:#fff5dc; text-align:center; }
#rot.on { display:flex; }
#rot .ico { font-size:90px; }
#rot p { margin:0; font-size:28px; font-weight:900; }
.profile-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,43,51,.78);color:#26343a;touch-action:auto}.profile-overlay.on{display:flex}.profile-dialog{width:min(760px,94vw);min-height:480px;padding:34px 46px 38px;border:8px solid #435b63;border-radius:34px;background:#fff5dc;box-shadow:0 14px 0 rgba(20,25,25,.24);text-align:center}.profile-dialog h1{margin:0 0 6px;color:#ef8b45;font-size:clamp(30px,5vw,52px);line-height:1.05}.profile-dialog p{margin:8px 0 20px;font-size:clamp(19px,3vw,28px);font-weight:800}.profile-step.hidden{display:none}.profile-step label{display:block;margin:16px 0 10px;font-size:24px;font-weight:900}.profile-step input{display:block;width:min(540px,90%);margin:0 auto 24px;padding:14px 18px;border:5px solid #6e8790;border-radius:18px;background:#fff;color:#26343a;font:900 30px system-ui,sans-serif;text-align:center}.profile-dialog button{min-width:180px;min-height:70px;margin:8px;padding:10px 20px;border:4px solid rgba(38,52,58,.55);border-radius:20px;background:#48b878;color:#fff5dc;font:900 22px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}.profile-dialog button:active{transform:translateY(3px)}.profile-colors,.profile-levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px auto 18px}.profile-colors button{min-width:90px;font-size:42px;line-height:1}.profile-levels button{min-width:220px;background:#6e8790}.profile-levels button.selected{background:#ef8b45}.profile-levels small{font-size:15px}.profile-shapes{max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px auto 18px}.profile-shapes button{min-width:70px;min-height:70px;margin:0;padding:0;background:#9b6dcc;font-size:35px}.profile-shapes button.selected{background:#ffcb4c;color:#26343a}#profile-secret-status{min-height:28px;font-size:20px;font-weight:900}#profile-skip-secret{background:#6e8790}
</style>
</head>
<body>
<canvas id="c" aria-label="Dino Officina"></canvas>
<div id="profile-overlay" class="profile-overlay" aria-hidden="true"><section class="profile-dialog" role="dialog" aria-labelledby="profile-title">
<h1 id="profile-title">Nuovo dino</h1><p id="profile-copy">Cominciamo insieme</p>
<div class="profile-step" id="profile-step-name"><label for="profile-name">Come si chiama?</label><input id="profile-name" maxlength="18" autocomplete="off" value="Dino"><button id="profile-next-name" type="button">AVANTI</button><button id="profile-cancel" type="button">ANNULLA</button></div>
<div class="profile-step hidden" id="profile-step-color"><p>Scegli un colore</p><div class="profile-colors"><button type="button" data-color="#48b878">●</button><button type="button" data-color="#ef735d">●</button><button type="button" data-color="#4e9ed6">●</button><button type="button" data-color="#ef8b45">●</button></div><button id="profile-next-color" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-level"><p>Quanti anni ha il dino?</p><div class="profile-levels"><button id="profile-level-small" type="button">PICCOLO<br><small>3–4 anni</small></button><button id="profile-level-big" type="button">GRANDE<br><small>5–7 anni</small></button></div><button id="profile-next-level" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-secret"><p>Scegli 3 figure, oppure salta</p><div class="profile-shapes"><button type="button" data-shape="0">♥</button><button type="button" data-shape="1">★</button><button type="button" data-shape="2">☾</button><button type="button" data-shape="3">●</button><button type="button" data-shape="4">◆</button><button type="button" data-shape="5">✿</button><button type="button" data-shape="6">☀</button><button type="button" data-shape="7">▲</button><button type="button" data-shape="8">■</button></div><div id="profile-secret-status">0 / 3</div><button id="profile-skip-secret" type="button">SENZA SEGRETO</button><button id="profile-create" type="button">CREA PROFILO</button></div>
</section></div>
<div id="rot"><div class="ico">↻</div><p>Gira il tablet<br>di lato!</p></div>

  function blank(){return{level:1,stars:0,done:{},freeBuilds:0,mute:false};}
  function clean(s){var b=blank(),k;if(!s||typeof s!=='object'||Array.isArray(s))return b;for(k in b)if(s[k]===undefined||s[k]===null)s[k]=b[k];if(typeof s.done!=='object'||Array.isArray(s.done))s.done={};if(typeof s.stars!=='number'||!isFinite(s.stars)||s.stars<0)s.stars=0;s.stars=Math.floor(s.stars);return s;}
  function readProfile(id){var p=profiles.filter(function(q){return q.id===id;})[0],s=null;if(p&&p.id==='legacy')s=legacy||null;try{s=s||JSON.parse(localStorage.getItem(LEGACY_KEY+'.'+id)||'null');}catch(e){}return clean(s);}

/* ===== 01-art.js ===== */
/* Pezzi e macchine: forme originali disegnate a canvas. */
(function(){'use strict';var c=G.ctx,C=G.C,T=G.TAU;
  function bolt(x,y,r){c.fillStyle=C.cream;c.beginPath();c.arc(x,y,r,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=Math.max(2,r*.3);c.stroke();c.beginPath();c.moveTo(x-r*.55,y);c.lineTo(x+r*.55,y);c.stroke();}
  G.drawPiece=function(type,x,y,scale,color,alpha,rot){scale=scale||1;color=color||C.red;c.save();c.translate(x,y);c.rotate(rot||0);c.globalAlpha=alpha===undefined?1:alpha;c.lineJoin='round';c.lineCap='round';c.strokeStyle=C.ink;c.lineWidth=5*scale;c.fillStyle=color;
    if(type==='beam'){G.roundRect(-62*scale,-19*scale,124*scale,38*scale,13*scale);c.fill();c.stroke();[-42,0,42].forEach(function(q){bolt(q*scale,0,7*scale);});}
    if(type==='wheel'){c.fillStyle=C.ink;c.beginPath();c.arc(0,0,43*scale,0,T);c.fill();c.fillStyle=color;c.beginPath();c.arc(0,0,27*scale,0,T);c.fill();c.stroke();bolt(0,0,8*scale);}
    if(type==='block'){G.roundRect(-43*scale,-34*scale,86*scale,68*scale,12*scale);c.fill();c.stroke();[-22,22].forEach(function(q){bolt(q*scale,0,7*scale);});}
    if(type==='cab'){G.roundRect(-50*scale,-35*scale,100*scale,70*scale,13*scale);c.fill();c.stroke();c.fillStyle='#aee6ef';G.roundRect(-28*scale,-23*scale,56*scale,34*scale,7*scale);c.fill();c.stroke();}
    if(type==='arm'){G.roundRect(-18*scale,-70*scale,36*scale,140*scale,12*scale);c.fill();c.stroke();[-48,0,48].forEach(function(q){bolt(0,q*scale,7*scale);});}
    if(type==='hook'){c.strokeStyle=color;c.lineWidth=20*scale;c.beginPath();c.moveTo(0,-45*scale);c.lineTo(0,20*scale);c.arc(22*scale,20*scale,22*scale,Math.PI,0);c.stroke();c.strokeStyle=C.ink;c.lineWidth=5*scale;c.stroke();}
    if(type==='prop'){c.fillStyle=color;for(var i=0;i<3;i++){c.rotate(T/3);c.beginPath();c.ellipse(0,-33*scale,14*scale,36*scale,0,0,T);c.fill();c.stroke();}bolt(0,0,9*scale);}

    if(type==='bucket'){c.beginPath();c.moveTo(-50*scale,-30*scale);c.lineTo(48*scale,-18*scale);c.lineTo(34*scale,36*scale);c.lineTo(-34*scale,36*scale);c.closePath();c.fill();c.stroke();[-24,0,24].forEach(function(q){c.beginPath();c.moveTo(q*scale,34*scale);c.lineTo(q*scale,52*scale);c.stroke();});}
    if(type==='sail'){c.beginPath();c.moveTo(0,-70*scale);c.lineTo(0,55*scale);c.lineTo(70*scale,42*scale);c.closePath();c.fill();c.stroke();bolt(0,54*scale,7*scale);}
    if(type==='rocket'){c.beginPath();c.moveTo(0,-76*scale);c.quadraticCurveTo(48*scale,-25*scale,35*scale,48*scale);c.lineTo(0,70*scale);c.lineTo(-35*scale,48*scale);c.quadraticCurveTo(-48*scale,-25*scale,0,-76*scale);c.closePath();c.fill();c.stroke();c.fillStyle='#aee6ef';c.beginPath();c.arc(0,-18*scale,14*scale,0,T);c.fill();c.stroke();}
    if(type==='antenna'){c.strokeStyle=color;c.lineWidth=13*scale;c.beginPath();c.moveTo(0,55*scale);c.lineTo(0,-38*scale);c.stroke();c.fillStyle=color;c.beginPath();c.arc(0,-52*scale,18*scale,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=5*scale;c.stroke();}
    if(type==='chimney'){G.roundRect(-25*scale,-58*scale,50*scale,116*scale,10*scale);c.fill();c.stroke();G.roundRect(-39*scale,-67*scale,78*scale,26*scale,8*scale);c.fill();c.stroke();}

    if(type==='claw'){c.strokeStyle=color;c.lineWidth=17*scale;c.beginPath();c.moveTo(0,-52*scale);c.lineTo(0,8*scale);c.moveTo(0,8*scale);c.quadraticCurveTo(-48*scale,15*scale,-42*scale,52*scale);c.moveTo(0,8*scale);c.quadraticCurveTo(48*scale,15*scale,42*scale,52*scale);c.stroke();c.strokeStyle=C.ink;c.lineWidth=4*scale;c.stroke();bolt(0,6*scale,7*scale);}
    c.restore();
  };
  G.drawDino=function(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=C.green;c.strokeStyle=C.ink;c.lineWidth=6;c.beginPath();c.ellipse(0,0,62,54,0,0,T);c.fill();c.stroke();c.beginPath();c.arc(42,-57,45,0,T);c.fill();c.stroke();c.fillStyle=C.cream;c.beginPath();c.ellipse(57,-45,28,18,0,0,T);c.fill();c.stroke();c.fillStyle=C.ink;c.beginPath();c.arc(52,-70,6,0,T);c.fill();c.strokeStyle=C.ink;c.lineWidth=8;c.beginPath();c.moveTo(-34,40);c.lineTo(-38,78);c.moveTo(32,40);c.lineTo(38,78);c.stroke();c.restore();};
})();


/* ===== 03-catalog.js ===== */
/* Catalogo dei progetti. Cento schede, una sola logica di montaggio.
   Ogni progetto combina un disegno sensato con nome, famiglia e colori propri. */
(function () {
  'use strict';

  var secretShapes = ['♥', '★', '☾', '●', '◆', '✿', '☀', '▲', '■'];
  var gate = { hold: 0, unlocked: false };

  function persist() { try { localStorage.setItem(G._profilesKey, JSON.stringify(list)); } catch (e) {} }

  function nameFor() { return draft.name; }

    for (i = 0; i < ids.length; i++) { node = el('profile-step-' + ids[i]); if (node && node.classList) node.classList.toggle('hidden', i !== n); }
    var title = el('profile-title'), copy = el('profile-copy');
    if (title) title.textContent = ['Nuovo dino', 'Il suo colore', 'Piccolo o Grande?', 'Un segreto per il dino'][n];
    if (copy) copy.textContent = ['Creiamo il suo profilo', 'Scegli un colore allegro', 'Potrai cambiarlo dai genitori', 'Tre figure in ordine, oppure salta'][n];
  }

    list.slice(0, 3).forEach(function (p, i) { card(c, p, i, false); });
    G.ui.button({ id: 'new-profile', x: 460, y: 570, w: 360, h: 100, r: 26, color: C.green, label: 'NUOVO DINO', fontSize: 32, onTap: function () { G.go('nuovo'); } });
    if (list.length) G.ui.button({ id: 'manage-profile', x: 1010, y: 24, w: 240, h: 70, r: 20, color: C.steel2, label: 'GENITORI', fontSize: 23, onTap: function () { gate.hold = 0; gate.unlocked = false; G.go('genitori'); } });
  } });

  G.scene('nuovo', { enter: function () { draft = { name: 'Dino', color: C.green, level: 1, secret: [] }; showWizard(); }, draw: function (c) {
    G.workshopBg(); G.text('NUOVO DINO', W / 2, 74, { size: 50, color: C.sun, stroke: C.ink, sw: 9 });
    G.ui.button({ id: 'name', x: 180, y: 145, w: 420, h: 90, r: 22, color: C.cream, textColor: C.ink, label: draft.name, fontSize: 32, onTap: function () { draft.name = nameFor(); } });
    G.text('Scegli colore ed età', 850, 160, { size: 26, color: C.cream });
    [C.green, C.red, C.blue, C.orange].forEach(function (col, i) { G.ui.button({ id: 'col' + i, x: 660 + i * 125, y: 190, w: 100, h: 90, r: 22, color: col, label: '●', fontSize: 42, onTap: function () { draft.color = col; } }); });
    G.ui.button({ id: 'small', x: 650, y: 305, w: 260, h: 82, r: 22, color: draft.level === 1 ? C.green : C.steel2, label: 'PICCOLO', fontSize: 27, onTap: function () { draft.level = 1; } });
    G.ui.button({ id: 'big', x: 930, y: 305, w: 260, h: 82, r: 22, color: draft.level === 2 ? C.red : C.steel2, label: 'GRANDE', fontSize: 27, onTap: function () { draft.level = 2; } });
    G.text('Segreto facoltativo: tocca tre figure', W / 2, 420, { size: 25, color: C.cream });
    secretShapes.forEach(function (shape, i) {
      var bx = 410 + (i % 5) * 96, by = 430 + Math.floor(i / 5) * 82;
      G.ui.button({ id: 'secret-' + i, x: bx, y: by, w: 82, h: 70, r: 18, color: draft.secret.indexOf(i) >= 0 ? C.sun : C.steel2, label: shape, textColor: C.ink, fontSize: 34, onTap: function () { if (draft.secret.length < 3 && draft.secret.indexOf(i) < 0) draft.secret.push(i); else if (draft.secret.indexOf(i) >= 0) draft.secret.splice(draft.secret.indexOf(i), 1); } });
    });
    G.ui.button({ id: 'create-profile', x: 340, y: 590, w: 300, h: 92, r: 22, color: C.green, label: 'CREA', fontSize: 31, onTap: function () { var p = G.accounts.create(draft); G._profileLogin(p.id); G.go('menu'); } });
    G.ui.button({ id: 'cancel-profile', x: 680, y: 590, w: 300, h: 92, r: 22, color: C.steel2, label: 'INDIETRO', fontSize: 28, onTap: function () { G.go('accesso'); } });
  } });

  G.scene('segreto', {
    enter: function () { gate.hold = 0; hideWizard(); },
    draw: function (c) {
      G.workshopBg();
      G.text('IL SEGRETO DEL DINO', W / 2, 70, { size: 43, color: C.sun, stroke: C.ink, sw: 9 });
      G.text('Tocca le tre figure nell’ordine', W / 2, 125, { size: 28, color: C.cream });
      secretShapes.forEach(function (shape, i) {
        var bx = 405 + (i % 5) * 100, by = 170 + Math.floor(i / 5) * 112;
        G.ui.button({
          id: 'check-' + i, x: bx, y: by, w: 86, h: 90, r: 20, color: C.plum,
          label: shape, fontSize: 42,
          onTap: function () {
            var p = profile(pending), want = p && p.secret ? p.secret : [];
            if (want[gate.hold] === i) {
              gate.hold++;
              if (gate.hold >= want.length) {
                var id = pending; pending = null; gate.hold = 0;
                G._profileLogin(id); G.go('menu');
              }
            } else { gate.hold = 0; G.say('Riproviamo insieme.'); }
          }
        });
      });
      G.text(gate.hold ? 'Figure: ' + gate.hold + ' / 3' : 'Inizia dal primo simbolo', W / 2, 500, { size: 28, color: C.cream });
      G.ui.button({ id: 'secret-back', x: 470, y: 590, w: 340, h: 90, r: 22, color: C.steel2, label: 'INDIETRO', fontSize: 28, onTap: function () { pending = null; G.go('accesso'); } });
    }
  });

  G.scene('genitori', { update: function (dt) { if (!gate.unlocked && gate.hold > 0 && G.pointer.down) gate.hold = Math.max(0, gate.hold - dt); }, draw: function (c) {
    G.workshopBg(); G.text('AREA GENITORI', W / 2, 80, { size: 48, color: C.sun, stroke: C.ink, sw: 9 });
    if (!gate.unlocked) { G.text('Tieni premuto per entrare', W / 2, 220, { size: 34, color: C.cream }); G.ui.button({ id: 'unlock', x: 440, y: 300, w: 400, h: 140, r: 28, color: C.orange, label: gate.hold ? 'ANCORA…' : 'TIENI PREMUTO', fontSize: 30, onDown: function () { gate.hold = 1.6; }, onTap: function () { if (gate.hold <= 0) { gate.unlocked = true; G.sfx('snap'); } else G.say('Tieni ancora un pochino.'); } }); }
    else { G.text('Scegli il profilo e la difficoltà', W / 2, 145, { size: 28, color: C.cream }); list.slice(0, 3).forEach(function (p, i) { card(c, p, i, true); }); G.ui.button({ id: 'parents-back', x: 480, y: 610, w: 320, h: 78, r: 20, color: C.steel2, label: 'MENU', fontSize: 27, onTap: function () { G.go('menu'); } }); }
  } });
})();
