<canvas id="c" aria-label="Dino Officina"></canvas>
<div id="profile-overlay" class="profile-overlay" aria-hidden="true"><section class="profile-dialog" role="dialog" aria-labelledby="profile-title">
<h1 id="profile-title">Nuovo dino</h1><p id="profile-copy">Cominciamo insieme</p>
<div class="profile-step" id="profile-step-name"><label for="profile-name">Come si chiama?</label><input id="profile-name" maxlength="18" autocomplete="off" value="Dino"><button id="profile-next-name" type="button">AVANTI</button><button id="profile-cancel" type="button">ANNULLA</button></div>
<div class="profile-step hidden" id="profile-step-color"><p>Scegli un colore</p><div class="profile-colors"><button type="button" data-color="#48b878">●</button><button type="button" data-color="#ef735d">●</button><button type="button" data-color="#4e9ed6">●</button><button type="button" data-color="#ef8b45">●</button></div><button id="profile-next-color" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-level"><p>Quanti anni ha il dino?</p><div class="profile-levels"><button id="profile-level-small" type="button">PICCOLO<br><small>3–4 anni</small></button><button id="profile-level-big" type="button">GRANDE<br><small>5–7 anni</small></button></div><button id="profile-next-level" type="button">AVANTI</button></div>
<div class="profile-step hidden" id="profile-step-secret"><p>Scegli 3 figure, oppure salta</p><div class="profile-shapes"><button type="button" data-shape="0">♥</button><button type="button" data-shape="1">★</button><button type="button" data-shape="2">☾</button><button type="button" data-shape="3">●</button><button type="button" data-shape="4">◆</button><button type="button" data-shape="5">✿</button><button type="button" data-shape="6">☀</button><button type="button" data-shape="7">▲</button><button type="button" data-shape="8">■</button></div><div id="profile-secret-status">0 / 3</div><button id="profile-skip-secret" type="button">SENZA SEGRETO</button><button id="profile-create" type="button">CREA PROFILO</button></div>
</section></div>
<div id="rot"><div class="ico">↻</div><p>Gira il tablet<br>di lato!</p></div>
